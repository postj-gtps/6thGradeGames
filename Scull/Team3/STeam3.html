<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape the Shcool — Scull / Team 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            font-family: 'Outfit', sans-serif;
        }
        h1, .font-display {
            font-family: 'Fredoka', sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="bg-slate-950 text-white h-screen w-screen flex flex-col items-center overflow-hidden p-2.5 select-none">

    <!-- Top HUD Bar (Hybrid DOM UI) -->
    <header class="w-full max-w-[1320px] mb-2 px-4 py-2 bg-slate-900/90 backdrop-blur-md border-2 border-amber-200/80 rounded-xl shadow-lg flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-3">
            <h1 class="text-lg md:text-xl font-bold tracking-wide text-amber-200 drop-shadow">
                ESCAPE THE SHCOOL <span class="text-xs font-semibold text-sky-300 bg-sky-950/80 border border-sky-500/40 px-2 py-0.5 rounded-full ml-1">TEAM 3</span>
            </h1>
            <span id="hudRoom" class="text-xs md:text-sm font-bold uppercase tracking-wider px-3 py-1 rounded-lg bg-sky-500/20 border border-sky-400/50 text-sky-200">
                SCHOOL HALLWAY
            </span>
        </div>

        <!-- Stat Pills -->
        <div class="flex items-center flex-wrap gap-2.5 text-xs md:text-sm font-bold">
            <!-- Hearts + Continuous Health Bar -->
            <div class="flex items-center gap-2 px-3 py-1 rounded-lg bg-rose-950/70 border border-rose-500/50 text-rose-300 shadow-inner">
                <span id="hudHearts">HEARTS: ♥♥♥</span>
                <div class="w-16 h-2.5 bg-slate-800 rounded-full overflow-hidden border border-rose-400/40" title="Current Heart Health">
                    <div id="hudHpBar" class="h-full bg-gradient-to-r from-rose-500 to-pink-400 transition-all duration-75" style="width: 100%"></div>
                </div>
            </div>

            <!-- Keys Counter -->
            <div id="hudKeys" class="px-3 py-1 rounded-lg bg-amber-950/70 border border-amber-400/50 text-amber-300">
                KEYS: 0 / 5
            </div>

            <!-- Hidden Tokens Counter (Starts at 0/2 - Must be found!) -->
            <div id="hudTokens" class="px-3 py-1 rounded-lg bg-emerald-950/70 border border-emerald-400/50 text-emerald-300" title="Find the 2 hidden tokens in the hallway!">
                TOKENS: 0 / 2 (FIND THEM!)
            </div>

            <!-- Room Status Badge (Bubble Hits / Limbs / Cooldown) -->
            <div id="hudStatus" class="hidden px-3 py-1 rounded-lg bg-purple-950/80 border border-purple-400/60 text-purple-200">
                STATUS
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center gap-2">
            <button id="btnToken" onclick="useEscapeToken()" disabled
                class="px-3 py-1.5 rounded-lg text-xs font-extrabold uppercase tracking-wider border border-emerald-400 text-emerald-300 hover:bg-emerald-400 hover:text-slate-950 disabled:opacity-35 disabled:pointer-events-none transition shadow">
                Use Token [T]
            </button>
            <button onclick="resetSimulation()"
                class="px-3 py-1.5 rounded-lg text-xs font-extrabold uppercase tracking-wider border border-amber-200/80 text-amber-100 hover:bg-amber-200 hover:text-slate-950 transition shadow">
                Reset
            </button>
        </div>
    </header>

    <!-- Main 3D Over-the-Shoulder Game Canvas -->
    <main id="canvas-wrapper" class="relative w-full max-w-[1320px] flex-grow rounded-xl overflow-hidden border-2 border-amber-200/80 shadow-2xl bg-[#f6eedb]">
        <canvas id="simCanvas"></canvas>
    </main>

    <!-- Controls Footer -->
    <footer class="mt-1.5 text-xs text-slate-300 text-center tracking-wide">
        <span class="text-amber-300 font-bold">[W]</span> Forward &nbsp;•&nbsp;
        <span class="text-amber-300 font-bold">[S]</span> Back &nbsp;•&nbsp;
        <span class="text-amber-300 font-bold">[A / D]</span> Left / Right &nbsp;•&nbsp;
        <span class="text-amber-300 font-bold">[SPACE]</span> Jump &nbsp;•&nbsp;
        <span class="text-emerald-300 font-bold">[T]</span> Use Found Token (2 Hidden in Hallway)
    </footer>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // HUD DOM refs
        const hudRoomEl = document.getElementById('hudRoom');
        const hudHeartsEl = document.getElementById('hudHearts');
        const hudHpBarEl = document.getElementById('hudHpBar');
        const hudKeysEl = document.getElementById('hudKeys');
        const hudTokensEl = document.getElementById('hudTokens');
        const hudStatusEl = document.getElementById('hudStatus');
        const btnTokenEl = document.getElementById('btnToken');

        // KEYBOARD INPUT STATE (Strict WASD + SPACE/T/R; Arrow keys ignored)
        const keys = {};

        function clearAllKeys() {
            for (const k in keys) {
                keys[k] = false;
            }
        }

        // GAME CONSTANTS
        const TOTAL_KEYS_NEEDED = 5;
        const GRAVITY = 0.68;
        const JUMP_VELOCITY = 13.0;
        const HP_PER_HEART = 100;

        // STICKMAN PLAYER STATE (3D Over-the-Shoulder Coordinates)
        const player = {
            x: 0,
            y: 0,
            z: 60,
            vy: 0,
            grounded: true,
            speedX: 5.3,
            speedZ: 6.3,
            facing: 1,
            walkFrame: 0,
            invulnTimer: 0,
            bubbleTimer: 0,     // Door #2: Stuck in seawater bubble for 3 seconds (180 frames)
            eraseProgress: 0,   // Door #4: Accumulates when Eraser touches Stickman too long
            limbs: {
                leftArm: true,
                rightArm: true,
                leftLeg: true,
                rightLeg: true
            }
        };

        // GAME STATE
        const game = {
            mode: 'hallway',      // 'hallway', 'room', 'room_fail', 'finale_bus', 'victory', 'gameover'
            activeRoomId: null,   // 1..5
            hearts: 3,
            maxHearts: 3,
            heartHp: 100,         // Current heart's HP (0..100) so slow health drain works smoothly
            tokens: 0,            // Starts at 0! Player must find the 2 hidden tokens!
            maxTokens: 2,
            keysCollected: [false, false, false, false, false],
            carryingRoomKey: false,
            savedHallwayZ: 60,
            savedHallwayX: 0,
            bannerText: '',
            bannerTimer: 0,
            screenShake: 0,
            finaleTimer: 0,
            busX: 0,
            doorOpenProgress: 0,
            roomTimer: 0,
            bubbleHitCount: 0,    // Door #2: 3 hits = lose 1 heart
            towerIntegrity: 100,  // Door #3: Windy Wendy makes tower fall and restart!
            towerCollapseAnim: 0,
            roomEntities: [],
            projectiles: [],
            fractionTiles: [],
            shelves: [],
            hallwayObstacles: [],
            hallwayDoors: [],
            hiddenTokens: []
        };

        // 7 Hallway Doors (Doors #1 - #5 contain the 5 Keys; Doors #6 - #7 lead to the Giant 5-Keyhole Door)
        const HALLWAY_DOORS_CONFIG = [
            { id: 1, side: -1, z: 260,  label: 'DOOR #1', title: 'Reading Room',     hasKey: true,  color: '#e03131', desc: 'Beware sizing-up chomping books & the red Zapping Book (-2 Hearts)!' },
            { id: 2, side:  1, z: 540,  label: 'DOOR #2', title: 'School Library',   hasKey: true,  color: '#228be6', desc: 'Dodge falling shelves & metallic Jellyfish (3 bubble hits = -1 Heart)!' },
            { id: 3, side: -1, z: 820,  label: 'DOOR #3', title: 'Windy Tower Room', hasKey: true,  color: '#64748b', desc: 'Avoid Windy Wendy (white mist)—touching her topples your tower & drains hearts!' },
            { id: 4, side:  1, z: 1100, label: 'DOOR #4', title: 'Math Room',        hasKey: true,  color: '#10b981', desc: 'Jump ALL spiky fraction tiles! Dodge Pencils, Limbs-Erasing Eraser & 0% Failed Test!' },
            { id: 5, side: -1, z: 1380, label: 'DOOR #5', title: 'Band Room',        hasKey: true,  color: '#d6336c', desc: 'Outrun Rude Drume (big shiny pink & blue drum) and escape with Key #5!' },
            { id: 6, side:  1, z: 1660, label: 'DOOR #6', title: 'East Corridor',    hasKey: false, color: '#f59e0b', desc: 'Unlocked with your 5 keys!' },
            { id: 7, side: -1, z: 1940, label: 'DOOR #7', title: 'Bus Exit Wing',    hasKey: false, color: '#06b6d4', desc: 'Leads to the Giant 5-Keyhole Door!' }
        ];

        const GIANT_DOOR_Z = 2240;

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
        }

        window.addEventListener('resize', resizeCanvas);

        // STRICT KEYBOARD ENGINE & DRIFT PREVENTION
        window.addEventListener('keydown', (e) => {
            if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                e.preventDefault();
            }
            // Ignore arrow keys completely for movement
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                return;
            }

            keys[e.code] = true;

            if (e.code === 'Space' && player.grounded && player.bubbleTimer <= 0 && (game.mode === 'hallway' || game.mode === 'room')) {
                const legBonus = (player.limbs.leftLeg && player.limbs.rightLeg) ? 1.0 : 0.84;
                player.vy = JUMP_VELOCITY * legBonus;
                player.grounded = false;
            }

            if (e.code === 'KeyT') {
                useEscapeToken();
            }

            if (e.code === 'KeyR') {
                if (game.mode === 'room_fail') {
                    retryCurrentRoom();
                } else if (game.mode === 'victory' || game.mode === 'gameover') {
                    resetSimulation();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        window.addEventListener('blur', clearAllKeys);
        document.addEventListener('mouseleave', clearAllKeys);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) clearAllKeys();
        });

        function getCollectedKeyCount() {
            return game.keysCollected.filter(Boolean).length;
        }

        function countRemainingLimbs() {
            return Object.values(player.limbs).filter(Boolean).length;
        }

        function updateHUD() {
            const keyCount = getCollectedKeyCount();
            let heartsStr = '';
            for (let i = 0; i < game.maxHearts; i++) {
                heartsStr += i < game.hearts ? '♥' : '♡';
            }
            hudHeartsEl.textContent = `HEARTS: ${heartsStr}`;
            hudHpBarEl.style.width = `${game.hearts > 0 ? Math.max(0, Math.min(100, game.heartHp)) : 0}%`;

            hudKeysEl.textContent = `KEYS: ${keyCount} / ${TOTAL_KEYS_NEEDED}`;

            const foundCount = game.hiddenTokens.filter(t => t.collected).length;
            if (game.tokens > 0) {
                hudTokensEl.textContent = `TOKENS: ${game.tokens} / ${game.maxTokens}`;
            } else if (foundCount < game.maxTokens) {
                hudTokensEl.textContent = `TOKENS: 0 / 2 (HIDDEN IN HALLWAY!)`;
            } else {
                hudTokensEl.textContent = `TOKENS: 0 / 2 (ALL USED)`;
            }

            if (game.mode === 'hallway') {
                hudRoomEl.textContent = 'SCHOOL HALLWAY';
                hudStatusEl.classList.add('hidden');
            } else if (game.mode === 'room' || game.mode === 'room_fail') {
                const cfg = HALLWAY_DOORS_CONFIG[game.activeRoomId - 1];
                hudRoomEl.textContent = `${cfg.label}: ${cfg.title.toUpperCase()}`;

                hudStatusEl.classList.remove('hidden');
                if (game.activeRoomId === 1) {
                    const zapper = game.roomEntities.find(e => e.kind === 'zapping_book');
                    hudStatusEl.textContent = zapper && zapper.cooldown > 0
                        ? `ZAPPER COOLDOWN: ${(zapper.cooldown / 60).toFixed(1)}s`
                        : 'ZAPPER READY (-2 HEARTS!)';
                } else if (game.activeRoomId === 2) {
                    hudStatusEl.textContent = `BUBBLE HITS: ${game.bubbleHitCount} / 3`;
                } else if (game.activeRoomId === 3) {
                    hudStatusEl.textContent = `TOWER: ${Math.round(game.towerIntegrity)}%`;
                } else if (game.activeRoomId === 4) {
                    hudStatusEl.textContent = `LIMBS: ${countRemainingLimbs()} / 4`;
                } else if (game.activeRoomId === 5) {
                    hudStatusEl.textContent = 'RUDE DRUME CHASING!';
                }
            } else if (game.mode === 'finale_bus' || game.mode === 'victory') {
                hudRoomEl.textContent = 'YELLOW SCHOOL BUS!';
                hudStatusEl.classList.add('hidden');
            } else {
                hudRoomEl.textContent = 'TRAPPED IN SHCOOL';
                hudStatusEl.classList.add('hidden');
            }

            const canUseToken = game.tokens > 0 && (game.mode === 'room' || game.mode === 'room_fail');
            btnTokenEl.disabled = !canUseToken;
        }

        function setBanner(text, frames = 210) {
            game.bannerText = text;
            game.bannerTimer = frames;
        }

        function buildHallwayWorld() {
            game.hallwayDoors = HALLWAY_DOORS_CONFIG.map(d => ({ ...d }));

            // Obstacles placed between the doors in the cream/tan/colorful/white hallway
            game.hallwayObstacles = [
                { type: 'cone',   x: -55, z: 385,  w: 36, h: 42, d: 30 },
                { type: 'boxes',  x:  65, z: 420,  w: 62, h: 48, d: 44 },
                { type: 'bin',    x: -70, z: 680,  w: 44, h: 48, d: 40 },
                { type: 'cone',   x:  45, z: 710,  w: 36, h: 42, d: 30 },
                { type: 'bench',  x:   0, z: 960,  w: 112, h: 36, d: 36 },
                { type: 'boxes',  x: -65, z: 1240, w: 62, h: 48, d: 44 },
                { type: 'cone',   x:  70, z: 1265, w: 36, h: 42, d: 30 },
                { type: 'bench',  x: -35, z: 1520, w: 105, h: 36, d: 36 },
                { type: 'bin',    x:  75, z: 1800, w: 46, h: 48, d: 40 },
                { type: 'cone',   x: -30, z: 2070, w: 36, h: 42, d: 30 }
            ];

            // 2 Escape Tokens hidden in the hallway (They do NOT spawn with you!)
            game.hiddenTokens = [
                { id: 1, x: 132,  y: 18, z: 445,  collected: false }, // Tucked behind the stacked crates after Door #1
                { id: 2, x: -132, y: 18, z: 1255, collected: false }  // Tucked behind the supply boxes after Door #4
            ];
        }

        function resetSimulation() {
            player.x = 0;
            player.y = 0;
            player.z = 65;
            player.vy = 0;
            player.grounded = true;
            player.facing = 1;
            player.walkFrame = 0;
            player.invulnTimer = 0;
            player.bubbleTimer = 0;
            player.eraseProgress = 0;
            player.limbs = { leftArm: true, rightArm: true, leftLeg: true, rightLeg: true };

            game.mode = 'hallway';
            game.activeRoomId = null;
            game.hearts = 3;
            game.heartHp = HP_PER_HEART;
            game.tokens = 0; // Token does NOT spawn with you!
            game.keysCollected = [false, false, false, false, false];
            game.carryingRoomKey = false;
            game.savedHallwayZ = 65;
            game.savedHallwayX = 0;
            game.screenShake = 0;
            game.finaleTimer = 0;
            game.busX = 0;
            game.doorOpenProgress = 0;
            game.roomEntities = [];
            game.projectiles = [];
            game.fractionTiles = [];
            game.shelves = [];

            buildHallwayWorld();
            setBanner('Escape the Shcool! Collect all 5 Keys (and search behind hallway obstacles for 2 hidden Tokens)!', 300);
            updateHUD();
        }

        function enterClassroom(roomId) {
            game.savedHallwayX = player.x * 0.4;
            game.savedHallwayZ = player.z;
            game.activeRoomId = roomId;
            game.mode = 'room';
            game.hearts = 3;
            game.heartHp = HP_PER_HEART;
            game.carryingRoomKey = false;
            game.roomTimer = 0;
            game.bubbleHitCount = 0;
            game.towerIntegrity = 100;
            game.towerCollapseAnim = 0;
            game.roomEntities = [];
            game.projectiles = [];
            game.fractionTiles = [];
            game.shelves = [];

            player.x = 0;
            player.y = 0;
            player.z = 70;
            player.vy = 0;
            player.grounded = true;
            player.invulnTimer = 35;
            player.bubbleTimer = 0;
            player.eraseProgress = 0;
            player.limbs = { leftArm: true, rightArm: true, leftLeg: true, rightLeg: true };

            const cfg = HALLWAY_DOORS_CONFIG[roomId - 1];
            setBanner(`${cfg.label} (${cfg.title}): ${cfg.desc}`, 280);

            if (roomId === 1) {
                // DOOR #1: Books fly off shelves sizing up to eat you + Big Red Zapping Book (-2 lives + cooldown)!
                const bookColors = ['#d9480f', '#1971c2', '#2f9e44', '#862e9c', '#e67700'];
                for (let i = 0; i < 5; i++) {
                    const side = i % 2 === 0 ? -1 : 1;
                    game.roomEntities.push({
                        kind: 'monster_book',
                        x: side * 215,
                        y: 65 + (i % 3) * 32,
                        z: 250 + i * 95,
                        scaleSize: 0.55,
                        activated: false,
                        chompPhase: i * 1.1,
                        speed: 2.5 + (i % 3) * 0.3,
                        color: bookColors[i % bookColors.length]
                    });
                }
                // Enemy #1: ZAPPING BOOK (Big red cover, medium speed, chases nearby, zaps for 2 lives + cooldown)
                game.roomEntities.push({
                    kind: 'zapping_book',
                    x: 90,
                    y: 42,
                    z: 520,
                    baseSpeed: 2.85,
                    cooldown: 0,
                    zapCharge: 0
                });
            } else if (roomId === 2) {
                // DOOR #2: Library with falling bookshelves + Wild Flying Jellyfish (purple/blue metallic, spits seawater bubbles)
                for (let i = 0; i < 7; i++) {
                    const side = i % 2 === 0 ? -1 : 1;
                    game.shelves.push({
                        side: side,
                        z: 215 + i * 80,
                        triggerZ: 145 + i * 72,
                        state: 'standing',
                        angle: 0,
                        shakeTimer: 0,
                        length: 190,
                        width: 56
                    });
                }
                // Enemy #2: WILD FLYING JELLYFISH (Purple & blue metallic, floats/bounces up & down, medium speed)
                for (let j = 0; j < 3; j++) {
                    game.roomEntities.push({
                        kind: 'jellyfish',
                        x: (j - 1) * 115,
                        y: 60 + j * 15,
                        z: 310 + j * 175,
                        vx: (j % 2 === 0 ? 1 : -1) * 2.4,
                        bobPhase: j * 2.1,
                        spitTimer: 65 + j * 30
                    });
                }
            } else if (roomId === 3) {
                // DOOR #3: WINDY WENDY (Fast white mist wandering randomly; makes tower fall & restart + drains heart!)
                for (let w = 0; w < 2; w++) {
                    game.roomEntities.push({
                        kind: 'windy_wendy',
                        x: w === 0 ? -110 : 110,
                        y: 35,
                        z: 340 + w * 230,
                        vx: (w === 0 ? 4.4 : -4.4),
                        vz: (w === 0 ? 3.8 : -3.8),
                        wanderTimer: 35 + w * 20,
                        swirlPhase: w * 1.7
                    });
                }
            } else if (roomId === 4) {
                // DOOR #4: THE MATH ROOM — Spiky Fraction Tiles all over the floor + Pencils, Eraser, and Failed Test!
                const fractions = ['1/2', '3/4', '2/5', '7/8', '1/3', '5/6', '3/10', '4/5', '2/3', '5/8', '1/4', '9/10'];
                let fIdx = 0;
                const rowZs = [190, 290, 390, 490, 590, 675];
                rowZs.forEach((rz, rIndex) => {
                    const cols = [-135, 0, 135];
                    const safeCol = (rIndex % 3) - 1;
                    cols.forEach((cx, cIndex) => {
                        const colId = cIndex - 1;
                        if (colId !== safeCol || rIndex % 2 === 1) {
                            game.fractionTiles.push({
                                x: cx,
                                z: rz,
                                w: 112,
                                d: 54,
                                label: fractions[fIdx % fractions.length],
                                color: ['#ff6b6b', '#4dabf7', '#ffd43b', '#51cf66', '#cc5de8'][fIdx % 5]
                            });
                            fIdx++;
                        }
                    });
                });

                // Enemy #4a: PENCIL (Yellow, silver metal top + eraser, dull graphite tip; fast chase; pokes & slowly drains health)
                game.roomEntities.push({
                    kind: 'pencil',
                    x: -145,
                    y: 30,
                    z: 360,
                    speed: 3.9,
                    pokePhase: 0
                });

                // Enemy #4b: ERASER (Pink rectangle with ERASER written on top; fast chase; erases limbs if touching too long)
                game.roomEntities.push({
                    kind: 'eraser',
                    x: 145,
                    y: 16,
                    z: 500,
                    speed: 3.85,
                    rubPhase: 0
                });

                // Enemy #4c: FAILED TEST (Normal math test with 0% on it; fast chase; slowly brings down health)
                game.roomEntities.push({
                    kind: 'failed_test',
                    x: 0,
                    y: 34,
                    z: 630,
                    speed: 4.0,
                    flutterPhase: 0
                });
            } else if (roomId === 5) {
                // DOOR #5: BAND ROOM — RUDE DRUME (Big, shiny pink & blue; chases Stickman at Medium speed)
                game.roomEntities.push({
                    kind: 'rude_drume',
                    x: 0,
                    y: 0,
                    z: 540,
                    speed: 2.95,
                    bouncePhase: 0
                });
            }

            updateHUD();
        }

        function completeRoomWithKey(usedToken = false) {
            const idx = game.activeRoomId - 1;
            game.keysCollected[idx] = true;
            game.carryingRoomKey = false;
            game.mode = 'hallway';
            game.activeRoomId = null;
            game.hearts = 3;
            game.heartHp = HP_PER_HEART;
            player.limbs = { leftArm: true, rightArm: true, leftLeg: true, rightLeg: true };

            player.x = 0;
            player.y = 0;
            player.z = game.savedHallwayZ;
            player.vy = 0;
            player.grounded = true;
            player.invulnTimer = 45;
            player.bubbleTimer = 0;

            const total = getCollectedKeyCount();
            if (total >= TOTAL_KEYS_NEEDED) {
                setBanner('ALL 5 KEYS COLLECTED! Run to the Giant 5-Keyhole Door & board the Yellow School Bus!', 360);
            } else if (usedToken) {
                setBanner(`Token used! Earned Key #${idx + 1} (${total}/5). Head to Door #${total + 1}!`, 260);
            } else {
                setBanner(`Great job! You got Key #${idx + 1} (${total}/5)! Next: Door #${total + 1}!`, 260);
            }
            updateHUD();
        }

        function useEscapeToken() {
            if (game.tokens <= 0) return;
            if (game.mode !== 'room' && game.mode !== 'room_fail') return;

            game.tokens -= 1;
            completeRoomWithKey(true);
        }

        // Instant Heart Damage (e.g., 1 Heart or 2 Hearts from Zapping Book)
        function damageHearts(heartsLost, reasonText, knockbackZ = 80) {
            if (player.invulnTimer > 0) return;

            game.hearts = Math.max(0, game.hearts - heartsLost);
            game.heartHp = game.hearts > 0 ? HP_PER_HEART : 0;
            game.screenShake = 14;
            player.invulnTimer = 55;
            updateHUD();

            if (game.hearts <= 0) {
                game.mode = 'room_fail';
                updateHUD();
            } else if (reasonText) {
                if (knockbackZ > 0) {
                    player.z = Math.max(70, player.z - knockbackZ);
                    player.y = 0;
                    player.vy = 0;
                    player.grounded = true;
                }
                const tokenHint = game.tokens > 0 ? ' [Press T to use a Token]' : '';
                setBanner(`${reasonText} (-${heartsLost} Heart${heartsLost > 1 ? 's' : ''}!${tokenHint})`, 190);
            }
        }

        // Gradual Health Drain (used by Door #4 Pencils & Failed Test, and Door #3 Windy Wendy)
        function drainHealthGradually(hpAmount, sourceLabel) {
            if (game.hearts <= 0) return;

            game.heartHp -= hpAmount;
            if (game.heartHp <= 0) {
                game.hearts -= 1;
                game.screenShake = 12;
                if (game.hearts <= 0) {
                    game.hearts = 0;
                    game.heartHp = 0;
                    game.mode = 'room_fail';
                    updateHUD();
                    return;
                } else {
                    game.heartHp = HP_PER_HEART;
                    setBanner(`${sourceLabel} drained a full Heart! (${game.hearts} left)`, 160);
                }
            }
            updateHUD();
        }

        function retryCurrentRoom() {
            if (game.activeRoomId) {
                enterClassroom(game.activeRoomId);
            }
        }

        function giveUpRun() {
            game.mode = 'gameover';
            updateHUD();
        }

        function updatePhysics() {
            if (game.screenShake > 0) game.screenShake -= 1;
            if (game.bannerTimer > 0) game.bannerTimer -= 1;
            if (player.invulnTimer > 0) player.invulnTimer -= 1;
            if (game.towerCollapseAnim > 0) game.towerCollapseAnim -= 1;

            // Finale cinematic: Keys insert into 5 keyholes -> Giant door opens -> Yellow School Bus!
            if (game.mode === 'finale_bus') {
                game.finaleTimer += 1;
                game.doorOpenProgress = Math.min(1, game.finaleTimer / 95);
                if (game.finaleTimer > 95) {
                    player.z += 4.5;
                    player.walkFrame += 0.3;
                }
                if (game.finaleTimer > 165) {
                    game.busX += 5.5;
                }
                if (game.finaleTimer >= 230) {
                    game.mode = 'victory';
                    updateHUD();
                }
                return;
            }

            if (game.mode !== 'hallway' && game.mode !== 'room') {
                return;
            }

            // Door #2: Stuck in seawater bubble for 3 seconds!
            if (player.bubbleTimer > 0) {
                player.bubbleTimer -= 1;
                player.y = 22 + Math.sin(game.roomTimer * 0.15) * 6;
                if (player.bubbleTimer === 0) {
                    player.y = 0;
                    player.grounded = true;
                    setBanner('Bubble popped! Keep moving!', 120);
                }
                updateClassroom(player.x, player.z);
                return;
            }

            // Movement Input (Strict WASD in 3D Over-the-Shoulder Space)
            let dx = 0;
            let dz = 0;

            if (keys['KeyW']) dz += 1;
            if (keys['KeyS']) dz -= 1;
            if (keys['KeyA']) { dx -= 1; player.facing = -1; }
            if (keys['KeyD']) { dx += 1; player.facing = 1; }

            if (dx !== 0 && dz !== 0) {
                dx *= 0.7071;
                dz *= 0.7071;
            }

            // Slight speed reduction if Eraser erased one or both legs in Door #4
            const legsCount = (player.limbs.leftLeg ? 1 : 0) + (player.limbs.rightLeg ? 1 : 0);
            const limbSpeedMult = legsCount === 2 ? 1.0 : (legsCount === 1 ? 0.85 : 0.72);

            const prevX = player.x;
            const prevZ = player.z;

            player.x += dx * player.speedX * limbSpeedMult;
            player.z += dz * player.speedZ * limbSpeedMult;

            // Vertical Jump Physics
            if (!player.grounded) {
                player.y += player.vy;
                player.vy -= GRAVITY;
                if (player.y <= 0) {
                    player.y = 0;
                    player.vy = 0;
                    player.grounded = true;
                }
            }

            // Walk Cycle Animation
            if (dx !== 0 || dz !== 0) {
                player.walkFrame += 0.28;
            } else {
                player.walkFrame = 0;
            }

            if (game.mode === 'hallway') {
                updateHallway(prevX, prevZ);
            } else if (game.mode === 'room') {
                updateClassroom(prevX, prevZ);
            }
        }

        function updateHallway(prevX, prevZ) {
            const hallHalfWidth = 155;
            player.x = Math.max(-hallHalfWidth, Math.min(hallHalfWidth, player.x));
            player.z = Math.max(40, Math.min(GIANT_DOOR_Z - 35, player.z));

            const collectedCount = getCollectedKeyCount();

            // Sequential hallway gate: collect keys from classrooms to open the next doors
            const maxUnlockedDoor = Math.min(7, collectedCount + 1);
            const barrierZ = maxUnlockedDoor < 7
                ? HALLWAY_DOORS_CONFIG[maxUnlockedDoor].z - 35
                : (collectedCount < TOTAL_KEYS_NEEDED ? GIANT_DOOR_Z - 90 : GIANT_DOOR_Z - 35);

            if (player.z > barrierZ) {
                player.z = barrierZ;
                if (game.bannerTimer <= 0 && collectedCount < TOTAL_KEYS_NEEDED) {
                    setBanner(`Locked! Collect Key #${collectedCount + 1} from Door #${collectedCount + 1} first!`, 120);
                }
            }

            // Hallway Obstacle Collisions (weave around or jump over with SPACE)
            for (const obs of game.hallwayObstacles) {
                const hitX = Math.abs(player.x - obs.x) < (obs.w * 0.5 + 14);
                const hitZ = Math.abs(player.z - obs.z) < (obs.d * 0.5 + 14);
                const hitY = player.y < (obs.h - 6);
                if (hitX && hitZ && hitY) {
                    player.x = prevX;
                    player.z = prevZ;
                }
            }

            // Check if Stickman finds one of the 2 Hidden Escape Tokens!
            for (const tok of game.hiddenTokens) {
                if (!tok.collected) {
                    const d = Math.hypot(player.x - tok.x, player.z - tok.z);
                    if (d < 36 && player.y < 55) {
                        tok.collected = true;
                        game.tokens += 1;
                        setBanner(`FOUND HIDDEN TOKEN #${tok.id}! (${game.tokens}/2 Available — Press [T] if stuck in a room!)`, 260);
                        updateHUD();
                    }
                }
            }

            // Enter Classroom Doors (#1 - #5)
            for (const door of game.hallwayDoors) {
                if (!door.hasKey) continue;
                const doorIdx = door.id - 1;
                const alreadyHaveKey = game.keysCollected[doorIdx];
                const isUnlocked = door.id <= collectedCount + 1;

                if (isUnlocked && !alreadyHaveKey) {
                    const nearWall = (door.side === -1 && player.x < -118) || (door.side === 1 && player.x > 118);
                    const nearZ = Math.abs(player.z - door.z) < 42;
                    if (nearWall && nearZ) {
                        enterClassroom(door.id);
                        return;
                    }
                }
            }

            // Reach Giant 5-Keyhole Door with all 5 Keys -> Escape to Yellow School Bus!
            if (collectedCount >= TOTAL_KEYS_NEEDED && player.z >= GIANT_DOOR_Z - 55) {
                game.mode = 'finale_bus';
                game.finaleTimer = 0;
                player.x = 0;
                updateHUD();
            }
        }

        function updateClassroom(prevX, prevZ) {
            game.roomTimer += 1;
            const roomHalfW = 210;
            const roomMaxZ = 820;

            player.x = Math.max(-roomHalfW, Math.min(roomHalfW, player.x));
            player.z = Math.max(35, Math.min(roomMaxZ, player.z));

            const keyZ = 735;
            const keyX = 0;

            // Grab the room's Golden Key
            if (!game.carryingRoomKey) {
                const distKey = Math.hypot(player.x - keyX, player.z - keyZ);
                if (distKey < 46 && player.y < 65) {
                    game.carryingRoomKey = true;
                    setBanner('KEY GRABBED! Run back out the EXIT DOOR behind you (Hold [S])!', 240);
                }
            }

            // Escape out the classroom exit door once carrying the key
            if (game.carryingRoomKey && player.z <= 58 && Math.abs(player.x) < 75) {
                completeRoomWithKey(false);
                return;
            }

            const rId = game.activeRoomId;

            // ==========================================
            // DOOR #1: READING ROOM (Monster Books + Zapping Book)
            // ==========================================
            if (rId === 1) {
                for (const ent of game.roomEntities) {
                    if (ent.kind === 'monster_book') {
                        const distToPlayer = Math.hypot(player.x - ent.x, player.z - ent.z);
                        if (player.z > 130 || game.carryingRoomKey || distToPlayer < 260) {
                            ent.activated = true;
                        }
                        if (ent.activated) {
                            ent.scaleSize = Math.min(2.3, ent.scaleSize + 0.025);
                            ent.chompPhase += 0.24;
                            const chaseMult = game.carryingRoomKey ? 1.2 : 1.0;
                            const angle = Math.atan2(player.z - ent.z, player.x - ent.x);
                            ent.x += Math.cos(angle) * ent.speed * chaseMult;
                            ent.z += Math.sin(angle) * ent.speed * chaseMult;
                            ent.y = 22 + Math.abs(Math.sin(ent.chompPhase * 0.7)) * 20;

                            if (Math.hypot(player.x - ent.x, player.z - ent.z) < 28 * (ent.scaleSize * 0.65) && player.y < 48) {
                                damageHearts(1, 'CHOMP! A giant book tried to eat you!');
                                if (game.mode !== 'room') return;
                            }
                        }
                    } else if (ent.kind === 'zapping_book') {
                        // Big Red Zapping Book: Medium speed, chases nearby, takes 2 lives + cooldown!
                        if (ent.cooldown > 0) {
                            ent.cooldown -= 1;
                            if (game.roomTimer % 10 === 0) updateHUD();
                        }
                        const dist = Math.hypot(player.x - ent.x, player.z - ent.z);
                        const currentSpeed = ent.cooldown > 0 ? ent.baseSpeed * 0.35 : ent.baseSpeed;

                        if (dist < 560 || game.carryingRoomKey) {
                            const angle = Math.atan2(player.z - ent.z, player.x - ent.x);
                            ent.x += Math.cos(angle) * currentSpeed;
                            ent.z += Math.sin(angle) * currentSpeed;
                        }
                        ent.y = 36 + Math.sin(game.roomTimer * 0.14) * 10;

                        if (ent.cooldown <= 0 && dist < 44 && player.y < 55) {
                            ent.cooldown = 240; // 4-second cooldown + slowdown after zapping!
                            damageHearts(2, 'ZAP!! The Red Zapping Book shocked you for 2 Lives & entered cooldown!', 95);
                            if (game.mode !== 'room') return;
                        }
                    }
                }
            }

            // ==========================================
            // DOOR #2: SCHOOL LIBRARY (Falling Shelves + Wild Flying Jellyfish)
            // ==========================================
            else if (rId === 2) {
                for (const shelf of game.shelves) {
                    if (shelf.state === 'standing' && (player.z > shelf.triggerZ || game.carryingRoomKey)) {
                        shelf.state = 'shaking';
                        shelf.shakeTimer = 34;
                    } else if (shelf.state === 'shaking') {
                        shelf.shakeTimer -= 1;
                        if (shelf.shakeTimer <= 0) {
                            shelf.state = 'falling';
                            game.screenShake = 6;
                        }
                    } else if (shelf.state === 'falling') {
                        shelf.angle += 0.065;
                        if (shelf.angle >= Math.PI / 2) {
                            shelf.angle = Math.PI / 2;
                            shelf.state = 'fallen';
                            game.screenShake = 10;
                        }
                    }

                    if (shelf.angle > 0.85) {
                        const minX = shelf.side === -1 ? -roomHalfW : (roomHalfW - shelf.length);
                        const maxX = shelf.side === -1 ? (-roomHalfW + shelf.length) : roomHalfW;
                        const inX = player.x > minX - 10 && player.x < maxX + 10;
                        const inZ = Math.abs(player.z - shelf.z) < (shelf.width * 0.5 + 12);

                        if (inX && inZ) {
                            if (shelf.state === 'falling') {
                                damageHearts(1, 'CRASH! A library bookshelf fell on you!');
                                if (game.mode !== 'room') return;
                            } else if (shelf.state === 'fallen' && player.y < 26) {
                                player.x = prevX;
                                player.z = prevZ;
                            }
                        }
                    }
                }

                // Wild Flying Jellyfish (Purple & blue metallic, bounces up & down, spits seawater bubbles)
                for (const ent of game.roomEntities) {
                    if (ent.kind === 'jellyfish') {
                        ent.bobPhase += 0.09;
                        ent.x += ent.vx;
                        if (ent.x > roomHalfW - 35 || ent.x < -roomHalfW + 35) ent.vx *= -1;
                        ent.y = 55 + Math.abs(Math.sin(ent.bobPhase)) * 45;

                        // Spit seawater bubbles
                        ent.spitTimer -= 1;
                        if (ent.spitTimer <= 0) {
                            ent.spitTimer = 115;
                            const ang = Math.atan2(player.z - ent.z, player.x - ent.x);
                            game.projectiles.push({
                                kind: 'seawater_bubble',
                                x: ent.x,
                                y: ent.y,
                                z: ent.z,
                                vx: Math.cos(ang) * 3.8,
                                vz: Math.sin(ang) * 3.8,
                                life: 150
                            });
                        }

                        // Direct jellyfish touch
                        const d = Math.hypot(player.x - ent.x, player.z - ent.z);
                        if (d < 36 && Math.abs(player.y + 24 - ent.y) < 38 && player.bubbleTimer <= 0 && player.invulnTimer <= 0) {
                            triggerBubbleHit('Touched the Metallic Jellyfish!');
                            if (game.mode !== 'room') return;
                        }
                    }
                }

                // Update seawater bubble projectiles
                for (let i = game.projectiles.length - 1; i >= 0; i--) {
                    const b = game.projectiles[i];
                    b.x += b.vx;
                    b.z += b.vz;
                    b.y = 26 + Math.sin(game.roomTimer * 0.15 + i) * 10;
                    b.life -= 1;

                    if (b.life <= 0 || Math.abs(b.x) > roomHalfW || b.z < 20 || b.z > roomMaxZ) {
                        game.projectiles.splice(i, 1);
                        continue;
                    }

                    const d = Math.hypot(player.x - b.x, player.z - b.z);
                    if (d < 28 && player.y < 48 && player.bubbleTimer <= 0 && player.invulnTimer <= 0) {
                        game.projectiles.splice(i, 1);
                        triggerBubbleHit('Hit by a Seawater Bubble!');
                        if (game.mode !== 'room') return;
                    }
                }
            }

            // ==========================================
            // DOOR #3: WINDY TOWER ROOM (Windy Wendy — White Mist)
            // ==========================================
            else if (rId === 3) {
                for (const ent of game.roomEntities) {
                    if (ent.kind === 'windy_wendy') {
                        ent.swirlPhase += 0.18;
                        ent.wanderTimer -= 1;
                        if (ent.wanderTimer <= 0) {
                            ent.wanderTimer = 28 + Math.floor(Math.random() * 25);
                            const randAng = Math.random() * Math.PI * 2;
                            const spd = 4.9; // Fast (Tricky!)
                            ent.vx = Math.cos(randAng) * spd;
                            ent.vz = Math.sin(randAng) * spd;
                        }

                        ent.x += ent.vx;
                        ent.z += ent.vz;
                        if (ent.x > roomHalfW - 30 || ent.x < -roomHalfW + 30) ent.vx *= -1;
                        if (ent.z > 760 || ent.z < 120) ent.vz *= -1;
                        ent.y = 32 + Math.sin(ent.swirlPhase * 0.6) * 14;

                        // Touching Windy Wendy makes your tower fall & restart + drains your heart!
                        const d = Math.hypot(player.x - ent.x, player.z - ent.z);
                        if (d < 44 && player.y < 60 && player.invulnTimer <= 0) {
                            game.towerIntegrity = 0;
                            game.towerCollapseAnim = 50;
                            game.carryingRoomKey = false; // Tower falls & room restarts!
                            player.x = 0;
                            player.z = 70;
                            player.y = 0;
                            damageHearts(1, 'WINDY WENDY! Your tower fell & restarted and your heart drained!', 0);
                            setTimeout(() => {
                                if (game.activeRoomId === 3 && game.mode === 'room') {
                                    game.towerIntegrity = 100;
                                    updateHUD();
                                }
                            }, 900);
                            if (game.mode !== 'room') return;
                        }
                    }
                }
            }

            // ==========================================
            // DOOR #4: THE MATH ROOM (Spiky Fraction Tiles + Pencils, Eraser & Failed Test)
            // ==========================================
            else if (rId === 4) {
                // Spiky fraction tiles all over the floor—must jump over all of them!
                for (const tile of game.fractionTiles) {
                    const onX = Math.abs(player.x - tile.x) < (tile.w * 0.46);
                    const onZ = Math.abs(player.z - tile.z) < (tile.d * 0.46);
                    if (onX && onZ && player.y < 14) {
                        damageHearts(1, `OUCH! Touched spiky fraction tile ${tile.label}! Jump over them!`);
                        if (game.mode !== 'room') return;
                    }
                }

                let touchingEraser = false;

                for (const ent of game.roomEntities) {
                    const dist = Math.hypot(player.x - ent.x, player.z - ent.z);

                    if (ent.kind === 'pencil') {
                        ent.pokePhase += 0.25;
                        if (dist < 520 || game.carryingRoomKey) {
                            const ang = Math.atan2(player.z - ent.z, player.x - ent.x);
                            ent.x += Math.cos(ang) * ent.speed;
                            ent.z += Math.sin(ang) * ent.speed;
                        }
                        // Touching Pencil pokes you with its eraser and slowly drains health
                        if (dist < 34 && player.y < 46) {
                            drainHealthGradually(0.85, 'Pencil eraser poke');
                            if (game.mode !== 'room') return;
                        }
                    } else if (ent.kind === 'eraser') {
                        ent.rubPhase += 0.3;
                        if (dist < 520 || game.carryingRoomKey) {
                            const ang = Math.atan2(player.z - ent.z, player.x - ent.x);
                            ent.x += Math.cos(ang) * ent.speed;
                            ent.z += Math.sin(ang) * ent.speed;
                        }
                        // Eraser erases one of your limbs if you stand there too long!
                        if (dist < 38 && player.y < 42) {
                            touchingEraser = true;
                            player.eraseProgress += 1;
                            if (player.eraseProgress >= 55) {
                                player.eraseProgress = 0;
                                eraseNextStickmanLimb();
                            }
                        }
                    } else if (ent.kind === 'failed_test') {
                        ent.flutterPhase += 0.22;
                        if (dist < 540 || game.carryingRoomKey) {
                            const ang = Math.atan2(player.z - ent.z, player.x - ent.x);
                            ent.x += Math.cos(ang) * ent.speed;
                            ent.z += Math.sin(ang) * ent.speed;
                        }
                        ent.y = 32 + Math.sin(ent.flutterPhase) * 10;
                        // Failed Test (0%) slowly brings down your health on touch
                        if (dist < 36 && player.y < 52) {
                            drainHealthGradually(0.8, '0% Failed Math Test');
                            if (game.mode !== 'room') return;
                        }
                    }
                }

                if (!touchingEraser && player.eraseProgress > 0) {
                    player.eraseProgress = Math.max(0, player.eraseProgress - 0.5);
                }
            }

            // ==========================================
            // DOOR #5: BAND ROOM (Rude Drume — Big, Shiny Pink & Blue)
            // ==========================================
            else if (rId === 5) {
                for (const ent of game.roomEntities) {
                    if (ent.kind === 'rude_drume') {
                        ent.bouncePhase += 0.2;
                        const dist = Math.hypot(player.x - ent.x, player.z - ent.z);
                        if (dist < 620 || game.carryingRoomKey) {
                            const ang = Math.atan2(player.z - ent.z, player.x - ent.x);
                            ent.x += Math.cos(ang) * ent.speed;
                            ent.z += Math.sin(ang) * ent.speed;
                        }
                        ent.y = Math.abs(Math.sin(ent.bouncePhase)) * 14;

                        if (dist < 46 && player.y < 55) {
                            damageHearts(1, 'BA-DUM-CRASH! Rude Drume slammed you!');
                            if (game.mode !== 'room') return;
                        }
                    }
                }
            }
        }

        function triggerBubbleHit(reason) {
            player.bubbleTimer = 180; // Stuck for 3 seconds in a seawater bubble!
            player.invulnTimer = 60;
            game.bubbleHitCount += 1;
            updateHUD();

            if (game.bubbleHitCount >= 3) {
                game.bubbleHitCount = 0;
                damageHearts(1, `${reason} (3rd bubble hit = -1 Heart & trapped 3s!)`, 0);
            } else {
                setBanner(`${reason} Stuck in a bubble for 3s! (Hit ${game.bubbleHitCount}/3)`, 180);
            }
        }

        function eraseNextStickmanLimb() {
            const order = ['leftArm', 'rightArm', 'leftLeg', 'rightLeg'];
            const labels = {
                leftArm: 'Left Arm',
                rightArm: 'Right Arm',
                leftLeg: 'Left Leg',
                rightLeg: 'Right Leg'
            };
            for (const key of order) {
                if (player.limbs[key]) {
                    player.limbs[key] = false;
                    game.screenShake = 8;
                    updateHUD();
                    setBanner(`ERASED! The pink ERASER wiped away your ${labels[key]}! Keep moving!`, 190);
                    return;
                }
            }
            // If all 4 limbs are already erased, take 1 Heart damage
            damageHearts(1, 'The Eraser erased everything! (-1 Heart)', 60);
        }

        // ==========================================
        // 3D OVER-THE-SHOULDER PERSPECTIVE PROJECTION
        // ==========================================
        function createCamera() {
            return {
                x: player.x * 0.78 + 24,
                y: 94 + player.y * 0.35,
                z: player.z - 150,
                fov: canvas.width * 0.44,
                horizonY: canvas.height * 0.43
            };
        }

        function project3D(wx, wy, wz, cam) {
            const dz = Math.max(14, wz - cam.z);
            const scale = cam.fov / dz;
            return {
                x: canvas.width * 0.5 + (wx - cam.x) * scale,
                y: cam.horizonY + (cam.y - wy) * scale,
                scale: scale,
                dz: dz
            };
        }

        function drawQuad3D(pts, fillStyle, strokeStyle = null, lineWidth = 1) {
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length; i++) {
                ctx.lineTo(pts[i].x, pts[i].y);
            }
            ctx.closePath();
            if (fillStyle) {
                ctx.fillStyle = fillStyle;
                ctx.fill();
            }
            if (strokeStyle) {
                ctx.strokeStyle = strokeStyle;
                ctx.lineWidth = lineWidth;
                ctx.stroke();
            }
        }

        // ==========================================
        // RENDERING: HALLWAY & CLASSROOMS
        // ==========================================
        function drawHallwayEnvironment(cam) {
            const halfW = 185;
            const wallH = 215;
            const wainscotH = 88;
            const maxZ = GIANT_DOOR_Z + 60;
            const stepZ = 140;

            const endTL = project3D(-halfW, wallH, maxZ, cam);
            const endTR = project3D(halfW, wallH, maxZ, cam);
            const endBR = project3D(halfW, 0, maxZ, cam);
            const endBL = project3D(-halfW, 0, maxZ, cam);
            drawQuad3D([endTL, endTR, endBR, endBL], '#e8dcc4');

            const startStrip = Math.max(0, Math.floor((cam.z + 20) / stepZ) * stepZ);
            for (let z = maxZ - stepZ; z >= startStrip; z -= stepZ) {
                const z0 = z;
                const z1 = z + stepZ;
                const segIdx = Math.floor(z / stepZ);

                // White Tiled Floor + Cream Center Runner
                const f0L = project3D(-halfW, 0, z0, cam);
                const f0R = project3D(halfW, 0, z0, cam);
                const f1R = project3D(halfW, 0, z1, cam);
                const f1L = project3D(-halfW, 0, z1, cam);
                drawQuad3D([f0L, f0R, f1R, f1L], segIdx % 2 === 0 ? '#ffffff' : '#eef1f6', '#d8dee9', 1);

                const c0L = project3D(-42, 0, z0, cam);
                const c0R = project3D(42, 0, z0, cam);
                const c1R = project3D(42, 0, z1, cam);
                const c1L = project3D(-42, 0, z1, cam);
                drawQuad3D([c0L, c0R, c1R, c1L], segIdx % 2 === 0 ? '#f8f3e6' : '#efe7d4');

                // White Ceiling & Lights
                const t0L = project3D(-halfW, wallH, z0, cam);
                const t0R = project3D(halfW, wallH, z0, cam);
                const t1R = project3D(halfW, wallH, z1, cam);
                const t1L = project3D(-halfW, wallH, z1, cam);
                drawQuad3D([t0L, t0R, t1R, t1L], '#f8fafc', '#cbd5e1', 1);

                if (segIdx % 2 === 0) {
                    const l0L = project3D(-36, wallH - 1, z0 + 25, cam);
                    const l0R = project3D(36, wallH - 1, z0 + 25, cam);
                    const l1R = project3D(36, wallH - 1, z1 - 25, cam);
                    const l1L = project3D(-36, wallH - 1, z1 - 25, cam);
                    drawQuad3D([l0L, l0R, l1R, l1L], '#fffdf0', '#e2e8f0', 1);
                }

                // Cream, Tanned, Colorful & White Hallway Walls
                for (const side of [-1, 1]) {
                    const wx = side * halfW;
                    const u0B = project3D(wx, wainscotH, z0, cam);
                    const u0T = project3D(wx, wallH, z0, cam);
                    const u1T = project3D(wx, wallH, z1, cam);
                    const u1B = project3D(wx, wainscotH, z1, cam);
                    drawQuad3D([u0B, u0T, u1T, u1B], '#f6eedb', '#e5d8bc', 1);

                    const w0B = project3D(wx, 0, z0, cam);
                    const w0T = project3D(wx, wainscotH, z0, cam);
                    const w1T = project3D(wx, wainscotH, z1, cam);
                    const w1B = project3D(wx, 0, z1, cam);
                    drawQuad3D([w0B, w0T, w1T, w1B], '#c89d6c', '#a87c4f', 1);

                    const tr0B = project3D(wx, wainscotH - 4, z0, cam);
                    const tr0T = project3D(wx, wainscotH + 4, z0, cam);
                    const tr1T = project3D(wx, wainscotH + 4, z1, cam);
                    const tr1B = project3D(wx, wainscotH - 4, z1, cam);
                    drawQuad3D([tr0B, tr0T, tr1T, tr1B], '#ffffff');

                    // Colorful School Lockers between doors
                    if (segIdx % 2 === 1 && z < GIANT_DOOR_Z - 140) {
                        const lockerColors = ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6'];
                        const lColor = lockerColors[(segIdx + (side === 1 ? 2 : 0)) % lockerColors.length];
                        const lk0B = project3D(wx - side * 2, 4, z0 + 18, cam);
                        const lk0T = project3D(wx - side * 2, 128, z0 + 18, cam);
                        const lk1T = project3D(wx - side * 2, 128, z1 - 18, cam);
                        const lk1B = project3D(wx - side * 2, 4, z1 - 18, cam);
                        drawQuad3D([lk0B, lk0T, lk1T, lk1B], lColor, '#ffffff', 1.2);
                    }
                }
            }

            // 7 Hallway Doors
            const collectedCount = getCollectedKeyCount();
            for (const door of game.hallwayDoors) {
                if (door.z < cam.z + 10) continue;
                const wx = door.side * (halfW - 2);
                const dW = 58;
                const dH = 148;
                const p0B = project3D(wx, 0, door.z - dW * 0.5, cam);
                const p0T = project3D(wx, dH, door.z - dW * 0.5, cam);
                const p1T = project3D(wx, dH, door.z + dW * 0.5, cam);
                const p1B = project3D(wx, 0, door.z + dW * 0.5, cam);

                const isCompleted = door.hasKey && game.keysCollected[door.id - 1];
                const isUnlocked = door.id <= collectedCount + 1;

                const doorFill = isCompleted ? '#2b8a3e' : (isUnlocked ? door.color : '#64748b');
                drawQuad3D([p0B, p0T, p1T, p1B], doorFill, '#ffffff', 2.5);

                const signPos = project3D(wx - door.side * 12, dH + 22, door.z, cam);
                if (signPos.scale > 0.14) {
                    const fontSize = Math.max(9, Math.min(18, Math.round(24 * signPos.scale)));
                    ctx.font = `bold ${fontSize}px Outfit`;
                    ctx.textAlign = 'center';
                    ctx.fillStyle = isUnlocked ? '#1e293b' : '#64748b';
                    const statusIcon = isCompleted ? '✓' : (isUnlocked ? 'OPEN' : 'LOCKED');
                    ctx.fillText(`${door.label} [${statusIcon}]`, signPos.x, signPos.y);
                }
            }

            // Draw the 2 Hidden Escape Tokens in the hallway!
            for (const tok of game.hiddenTokens) {
                if (tok.collected || tok.z < cam.z + 12) continue;
                const bobY = tok.y + Math.sin(Date.now() * 0.006 + tok.id) * 6;
                const tp = project3D(tok.x, bobY, tok.z, cam);
                const r = Math.max(6, 16 * tp.scale);

                ctx.save();
                ctx.fillStyle = 'rgba(16, 185, 129, 0.35)';
                ctx.beginPath();
                ctx.arc(tp.x, tp.y, r * 1.45, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#10b981';
                ctx.strokeStyle = '#fef08a';
                ctx.lineWidth = Math.max(1.5, 2.5 * tp.scale);
                ctx.beginPath();
                ctx.arc(tp.x, tp.y, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = `bold ${Math.max(8, Math.round(13 * tp.scale))}px Fredoka`;
                ctx.textAlign = 'center';
                ctx.fillText('T', tp.x, tp.y + r * 0.35);
                ctx.restore();
            }

            // Giant Door with 5 Keyholes + Yellow School Bus outside!
            drawGiantExitDoor(cam);
        }

        function drawGiantExitDoor(cam) {
            const z = GIANT_DOOR_Z;
            if (z < cam.z + 20) return;

            const doorHalfW = 115;
            const doorH = 185;
            const collectedCount = getCollectedKeyCount();

            // Daylight sky outside the school
            const skyTL = project3D(-doorHalfW, doorH, z + 5, cam);
            const skyTR = project3D(doorHalfW, doorH, z + 5, cam);
            const skyBR = project3D(doorHalfW, 0, z + 5, cam);
            const skyBL = project3D(-doorHalfW, 0, z + 5, cam);
            drawQuad3D([skyTL, skyTR, skyBR, skyBL], '#74c0fc');

            // Yellow School Bus waiting outside!
            const busZ = z + 95;
            const busCenter = project3D(game.busX, 55, busZ, cam);
            const busW = 220 * busCenter.scale;
            const busH = 105 * busCenter.scale;

            if (busCenter.scale > 0.05) {
                const bx = busCenter.x - busW * 0.5;
                const by = busCenter.y - busH * 0.5;
                ctx.fillStyle = '#fcc419';
                ctx.strokeStyle = '#18181b';
                ctx.lineWidth = Math.max(1.5, 3 * busCenter.scale);
                ctx.beginPath();
                ctx.roundRect(bx, by, busW, busH, 8 * busCenter.scale);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#1e293b';
                ctx.fillRect(bx + busW * 0.08, by + busH * 0.22, busW * 0.84, busH * 0.28);
                ctx.fillRect(bx, by + busH * 0.58, busW, busH * 0.1);

                ctx.fillStyle = '#111827';
                ctx.beginPath();
                ctx.arc(bx + busW * 0.22, by + busH, busH * 0.16, 0, Math.PI * 2);
                ctx.arc(bx + busW * 0.78, by + busH, busH * 0.16, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#111827';
                ctx.font = `bold ${Math.max(8, Math.round(16 * busCenter.scale))}px Fredoka`;
                ctx.textAlign = 'center';
                ctx.fillText('SCHOOL BUS', busCenter.x, by + busH * 0.16);
            }

            // Left and Right Giant Door Panels
            const openShift = doorHalfW * game.doorOpenProgress;

            const l0B = project3D(-doorHalfW, 0, z, cam);
            const l0T = project3D(-doorHalfW, doorH, z, cam);
            const l1T = project3D(-openShift, doorH, z, cam);
            const l1B = project3D(-openShift, 0, z, cam);
            drawQuad3D([l0B, l0T, l1T, l1B], '#7c2d12', '#fde047', 3);

            const r0B = project3D(openShift, 0, z, cam);
            const r0T = project3D(openShift, doorH, z, cam);
            const r1T = project3D(doorHalfW, doorH, z, cam);
            const r1B = project3D(doorHalfW, 0, z, cam);
            drawQuad3D([r0B, r0T, r1T, r1B], '#7c2d12', '#fde047', 3);

            // 5 Keyholes across the Giant Door
            if (game.doorOpenProgress < 0.35) {
                for (let k = 0; k < 5; k++) {
                    const kx = -68 + k * 34;
                    const ky = 92;
                    const kp = project3D(kx, ky, z - 2, cam);
                    const r = Math.max(4, 11 * kp.scale);

                    const hasThisKey = game.keysCollected[k];
                    ctx.fillStyle = hasThisKey ? '#ffd43b' : '#1e293b';
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = Math.max(1, 2 * kp.scale);
                    ctx.beginPath();
                    ctx.arc(kp.x, kp.y, r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = hasThisKey ? '#7c2d12' : '#000000';
                    ctx.beginPath();
                    ctx.arc(kp.x, kp.y - r * 0.18, r * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillRect(kp.x - r * 0.15, kp.y - r * 0.1, r * 0.3, r * 0.55);
                }

                const bannerP = project3D(0, doorH + 16, z, cam);
                if (bannerP.scale > 0.08) {
                    ctx.font = `bold ${Math.max(10, Math.round(22 * bannerP.scale))}px Fredoka`;
                    ctx.textAlign = 'center';
                    ctx.fillStyle = collectedCount >= 5 ? '#ffd43b' : '#ffffff';
                    ctx.fillText(`GIANT 5-KEYHOLE DOOR (${collectedCount}/5 KEYS)`, bannerP.x, bannerP.y);
                }
            }
        }

        function drawClassroomEnvironment(cam) {
            const halfW = 240;
            const wallH = 220;
            const roomD = 860;
            const stepZ = 120;

            const rId = game.activeRoomId;
            const palettes = {
                1: { wall: '#f6eedb', trim: '#c89d6c', floorA: '#fff9db', floorB: '#f3e8c8' },
                2: { wall: '#efe3c6', trim: '#9c6644', floorA: '#f8f0dc', floorB: '#e6d5b8' },
                3: { wall: '#f1f5f9', trim: '#64748b', floorA: '#ffffff', floorB: '#e2e8f0' },
                4: { wall: '#ecfdf5', trim: '#10b981', floorA: '#ffffff', floorB: '#d1fae5' },
                5: { wall: '#fff0f6', trim: '#d6336c', floorA: '#ffffff', floorB: '#ffdeeb' }
            };
            const pal = palettes[rId] || palettes[1];

            // Back Wall & Chalkboard
            const bTL = project3D(-halfW, wallH, roomD, cam);
            const bTR = project3D(halfW, wallH, roomD, cam);
            const bBR = project3D(halfW, 0, roomD, cam);
            const bBL = project3D(-halfW, 0, roomD, cam);
            drawQuad3D([bTL, bTR, bBR, bBL], pal.wall, pal.trim, 3);

            const cbTL = project3D(-145, 165, roomD - 2, cam);
            const cbTR = project3D(145, 165, roomD - 2, cam);
            const cbBR = project3D(145, 65, roomD - 2, cam);
            const cbBL = project3D(-145, 65, roomD - 2, cam);
            drawQuad3D([cbTL, cbTR, cbBR, cbBL], rId === 4 ? '#1b4332' : '#1e293b', '#c89d6c', 4);

            const boardTextPos = project3D(0, 120, roomD - 3, cam);
            if (boardTextPos.scale > 0.1) {
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.font = `bold ${Math.max(10, Math.round(22 * boardTextPos.scale))}px Fredoka`;
                const boardTitles = {
                    1: 'DOOR #1: MONSTER BOOKS & ZAPPING BOOK!',
                    2: 'DOOR #2: FALLING SHELVES & JELLYFISH!',
                    3: 'DOOR #3: PROTECT YOUR TOWER FROM WINDY WENDY!',
                    4: 'DOOR #4 MATH ROOM: JUMP SPIKY FRACTION TILES!',
                    5: 'DOOR #5 BAND ROOM: ESCAPE RUDE DRUME!'
                };
                ctx.fillText(boardTitles[rId], boardTextPos.x, boardTextPos.y);
            }

            // Floor, Ceiling & Side Walls
            const startZ = Math.max(0, Math.floor((cam.z + 20) / stepZ) * stepZ);
            for (let z = roomD - stepZ; z >= startZ; z -= stepZ) {
                const z0 = z;
                const z1 = z + stepZ;
                const idx = Math.floor(z / stepZ);

                const f0L = project3D(-halfW, 0, z0, cam);
                const f0R = project3D(halfW, 0, z0, cam);
                const f1R = project3D(halfW, 0, z1, cam);
                const f1L = project3D(-halfW, 0, z1, cam);
                drawQuad3D([f0L, f0R, f1R, f1L], idx % 2 === 0 ? pal.floorA : pal.floorB, '#cbd5e1', 1);

                const t0L = project3D(-halfW, wallH, z0, cam);
                const t0R = project3D(halfW, wallH, z0, cam);
                const t1R = project3D(halfW, wallH, z1, cam);
                const t1L = project3D(-halfW, wallH, z1, cam);
                drawQuad3D([t0L, t0R, t1R, t1L], '#ffffff', '#e2e8f0', 1);

                for (const side of [-1, 1]) {
                    const wx = side * halfW;
                    const w0B = project3D(wx, 0, z0, cam);
                    const w0T = project3D(wx, wallH, z0, cam);
                    const w1T = project3D(wx, wallH, z1, cam);
                    const w1B = project3D(wx, 0, z1, cam);
                    drawQuad3D([w0B, w0T, w1T, w1B], pal.wall, pal.trim, 1);

                    const tr0B = project3D(wx, 0, z0, cam);
                    const tr0T = project3D(wx, 75, z0, cam);
                    const tr1T = project3D(wx, 75, z1, cam);
                    const tr1B = project3D(wx, 0, z1, cam);
                    drawQuad3D([tr0B, tr0T, tr1T, tr1B], pal.trim);
                }
            }

            // DOOR #3: Draw the Block Tower that collapses if Windy Wendy touches you!
            if (rId === 3) {
                const towerZ = 670;
                if (towerZ > cam.z + 15) {
                    const blocks = 5;
                    for (let b = 0; b < blocks; b++) {
                        const collapseOffset = game.towerCollapseAnim > 0
                            ? (b % 2 === 0 ? 1 : -1) * (50 - game.towerCollapseAnim) * 2.4
                            : 0;
                        const y0 = game.towerCollapseAnim > 0 ? 4 : b * 28;
                        const y1 = y0 + 26;
                        const w = 48 - b * 5;
                        const p0 = project3D(-w + collapseOffset, y0, towerZ, cam);
                        const p1 = project3D(w + collapseOffset, y0, towerZ, cam);
                        const p2 = project3D(w + collapseOffset, y1, towerZ, cam);
                        const p3 = project3D(-w + collapseOffset, y1, towerZ, cam);
                        const cols = ['#f59e0b', '#3b82f6', '#10b981', '#ef4444', '#8b5cf6'];
                        drawQuad3D([p0, p1, p2, p3], cols[b % cols.length], '#1e293b', 2);
                    }
                }
            }

            // DOOR #4: Spiky Fraction Tiles all over the floor!
            for (const tile of game.fractionTiles) {
                if (tile.z < cam.z + 10) continue;
                const p0L = project3D(tile.x - tile.w * 0.5, 1, tile.z - tile.d * 0.5, cam);
                const p0R = project3D(tile.x + tile.w * 0.5, 1, tile.z - tile.d * 0.5, cam);
                const p1R = project3D(tile.x + tile.w * 0.5, 1, tile.z + tile.d * 0.5, cam);
                const p1L = project3D(tile.x - tile.w * 0.5, 1, tile.z + tile.d * 0.5, cam);

                drawQuad3D([p0L, p0R, p1R, p1L], tile.color, '#1e293b', 2);

                // Spikes protruding from each fraction tile
                const spikeOffsets = [-0.32, 0, 0.32];
                for (const off of spikeOffsets) {
                    const sBaseL = project3D(tile.x + tile.w * off - 8, 1, tile.z, cam);
                    const sBaseR = project3D(tile.x + tile.w * off + 8, 1, tile.z, cam);
                    const sTip   = project3D(tile.x + tile.w * off, 21, tile.z, cam);
                    drawQuad3D([sBaseL, sTip, sBaseR], '#f8fafc', '#0f172a', 1.2);
                }

                const centerP = project3D(tile.x, 14, tile.z, cam);
                if (centerP.scale > 0.14) {
                    ctx.fillStyle = '#111827';
                    ctx.font = `bold ${Math.max(10, Math.round(22 * centerP.scale))}px Fredoka`;
                    ctx.textAlign = 'center';
                    ctx.fillText(tile.label, centerP.x, centerP.y + 4);
                }
            }

            // DOOR #2: Falling Library Bookshelves
            for (const shelf of game.shelves) {
                if (shelf.z < cam.z + 10) continue;
                const hingeX = shelf.side * (halfW - 10);
                const topDist = shelf.length;
                const tipX = hingeX - shelf.side * Math.sin(shelf.angle) * topDist;
                const tipY = Math.cos(shelf.angle) * topDist;
                const shakeX = shelf.state === 'shaking' ? Math.sin(game.roomTimer * 1.4) * 5 : 0;

                const zBack = shelf.z + shelf.width * 0.45;
                const zFront = shelf.z - shelf.width * 0.45;

                const b0 = project3D(hingeX + shakeX, 0, zFront, cam);
                const b1 = project3D(hingeX + shakeX, 0, zBack, cam);
                const t1 = project3D(tipX + shakeX, tipY, zBack, cam);
                const t0 = project3D(tipX + shakeX, tipY, zFront, cam);

                const shelfColor = shelf.state === 'shaking' ? '#e03131' : '#8d5524';
                drawQuad3D([b0, b1, t1, t0], shelfColor, '#3e2723', 2);

                if (shelf.state === 'shaking') {
                    const warnEnd = hingeX - shelf.side * shelf.length;
                    const w0 = project3D(hingeX, 1, zFront, cam);
                    const w1 = project3D(warnEnd, 1, zFront, cam);
                    const w2 = project3D(warnEnd, 1, zBack, cam);
                    const w3 = project3D(hingeX, 1, zBack, cam);
                    drawQuad3D([w0, w1, w2, w3], 'rgba(255, 59, 48, 0.28)', '#ff3b30', 1.5);
                }
            }

            // Render All Custom Enemies in the Active Classroom (Sorted back-to-front)
            const sortedEntities = [...game.roomEntities].sort((a, b) => b.z - a.z);
            for (const ent of sortedEntities) {
                if (ent.z < cam.z + 12) continue;
                drawCustomEnemy(ent, cam);
            }

            // Render Seawater Bubbles in Door #2
            for (const b of game.projectiles) {
                if (b.z < cam.z + 12) continue;
                const bp = project3D(b.x, b.y, b.z, cam);
                const r = Math.max(5, 16 * bp.scale);
                ctx.save();
                ctx.fillStyle = 'rgba(56, 189, 248, 0.45)';
                ctx.strokeStyle = '#e0f2fe';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(bp.x, bp.y, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Bubble shine
                ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
                ctx.beginPath();
                ctx.arc(bp.x - r * 0.3, bp.y - r * 0.3, r * 0.28, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Draw the Floating Golden Key (until picked up)
            if (!game.carryingRoomKey) {
                const bobY = 34 + Math.sin(game.roomTimer * 0.1) * 8;
                const kp = project3D(0, bobY, 735, cam);
                const kShadow = project3D(0, 0, 735, cam);

                ctx.fillStyle = 'rgba(255, 212, 59, 0.35)';
                ctx.beginPath();
                ctx.ellipse(kShadow.x, kShadow.y, 26 * kShadow.scale, 9 * kShadow.scale, 0, 0, Math.PI * 2);
                ctx.fill();

                drawGoldenKey(kp.x, kp.y, kp.scale * 1.4, game.activeRoomId);
            }
        }

        function drawCustomEnemy(ent, cam) {
            const p = project3D(ent.x, ent.y, ent.z, cam);
            const shadowP = project3D(ent.x, 0, ent.z, cam);
            const s = p.scale;

            // Ground shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.26)';
            ctx.beginPath();
            ctx.ellipse(shadowP.x, shadowP.y, 24 * shadowP.scale, 8 * shadowP.scale, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.save();
            ctx.translate(p.x, p.y);

            if (ent.kind === 'monster_book') {
                // Sizing-up Chomping Shelf Book
                const bs = s * ent.scaleSize;
                const bw = 38 * bs;
                const bh = 32 * bs;
                const jawOpen = ent.activated ? (0.25 + Math.abs(Math.sin(ent.chompPhase)) * 0.55) : 0.05;

                ctx.fillStyle = ent.color;
                ctx.strokeStyle = '#111827';
                ctx.lineWidth = Math.max(1.5, 2 * s);
                ctx.save();
                ctx.rotate(-jawOpen);
                ctx.fillRect(-bw * 0.5, -bh * 0.5, bw, bh * 0.45);
                ctx.strokeRect(-bw * 0.5, -bh * 0.5, bw, bh * 0.45);
                ctx.restore();

                ctx.save();
                ctx.rotate(jawOpen);
                ctx.fillRect(-bw * 0.5, 0, bw, bh * 0.45);
                ctx.strokeRect(-bw * 0.5, 0, bw, bh * 0.45);
                ctx.restore();

                if (ent.activated) {
                    ctx.fillStyle = '#ffffff';
                    for (let t = -2; t <= 2; t++) {
                        ctx.beginPath();
                        ctx.moveTo(t * (bw * 0.16) - 4 * bs, -3 * bs);
                        ctx.lineTo(t * (bw * 0.16) + 4 * bs, -3 * bs);
                        ctx.lineTo(t * (bw * 0.16), 6 * bs);
                        ctx.fill();
                    }
                    ctx.fillStyle = '#ffe066';
                    ctx.beginPath();
                    ctx.arc(-bw * 0.2, -bh * 0.35, 4.5 * bs, 0, Math.PI * 2);
                    ctx.arc(bw * 0.2, -bh * 0.35, 4.5 * bs, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (ent.kind === 'zapping_book') {
                // ENEMY #1: ZAPPING BOOK (Big with a red cover + electric zap bolts + cooldown indicator)
                const bw = 58 * s;
                const bh = 72 * s;

                // Electric Aura when ready
                if (ent.cooldown <= 0) {
                    ctx.strokeStyle = '#fde047';
                    ctx.lineWidth = Math.max(1.5, 3 * s);
                    ctx.beginPath();
                    for (let a = 0; a < 8; a++) {
                        const ang = (a / 8) * Math.PI * 2 + game.roomTimer * 0.2;
                        const r1 = bw * 0.65;
                        const r2 = bw * (0.85 + (a % 2) * 0.2);
                        ctx.moveTo(Math.cos(ang) * r1, Math.sin(ang) * r1);
                        ctx.lineTo(Math.cos(ang + 0.15) * r2, Math.sin(ang + 0.15) * r2);
                    }
                    ctx.stroke();
                }

                // Big Red Book Cover
                ctx.fillStyle = ent.cooldown > 0 ? '#991b1b' : '#dc2626';
                ctx.strokeStyle = '#fef08a';
                ctx.lineWidth = Math.max(2, 3 * s);
                ctx.beginPath();
                ctx.roundRect(-bw * 0.5, -bh * 0.5, bw, bh, 6 * s);
                ctx.fill();
                ctx.stroke();

                // Spine & Pages
                ctx.fillStyle = '#7f1d1d';
                ctx.fillRect(-bw * 0.5, -bh * 0.5, bw * 0.18, bh);
                ctx.fillStyle = '#fef9c3';
                ctx.fillRect(bw * 0.42, -bh * 0.46, bw * 0.08, bh * 0.92);

                // Lightning Bolt Emblem & Glowing Eyes
                ctx.fillStyle = ent.cooldown > 0 ? '#94a3b8' : '#fde047';
                ctx.beginPath();
                ctx.moveTo(4 * s, -16 * s);
                ctx.lineTo(-8 * s, 2 * s);
                ctx.lineTo(2 * s, 2 * s);
                ctx.lineTo(-4 * s, 20 * s);
                ctx.lineTo(12 * s, -2 * s);
                ctx.lineTo(2 * s, -2 * s);
                ctx.closePath();
                ctx.fill();

                if (s > 0.18) {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = `bold ${Math.max(8, Math.round(13 * s))}px Fredoka`;
                    ctx.textAlign = 'center';
                    ctx.fillText(ent.cooldown > 0 ? 'COOLDOWN' : 'ZAP BOOK (-2♥)', 0, -bh * 0.6);
                }
            } else if (ent.kind === 'jellyfish') {
                // ENEMY #2: WILD FLYING JELLYFISH (Purple and blue metallic color)
                const jr = 30 * s;
                const grad = ctx.createLinearGradient(-jr, -jr, jr, jr);
                grad.addColorStop(0, '#c084fc');
                grad.addColorStop(0.5, '#6366f1');
                grad.addColorStop(1, '#38bdf8');

                // Trailing metallic tentacles
                ctx.strokeStyle = '#a855f7';
                ctx.lineWidth = Math.max(1.5, 3 * s);
                for (let t = -3; t <= 3; t++) {
                    const wave = Math.sin(ent.bobPhase * 2 + t) * 7 * s;
                    ctx.beginPath();
                    ctx.moveTo(t * (jr * 0.24), 0);
                    ctx.quadraticCurveTo(t * (jr * 0.26) + wave, jr * 0.65, t * (jr * 0.22) - wave, jr * 1.25);
                    ctx.stroke();
                }

                // Metallic Dome Bell
                ctx.fillStyle = grad;
                ctx.strokeStyle = '#e0e7ff';
                ctx.lineWidth = Math.max(1.5, 2.5 * s);
                ctx.beginPath();
                ctx.arc(0, 0, jr, Math.PI, 0, false);
