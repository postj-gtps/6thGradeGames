                ctx.quadraticCurveTo(jr * 0.5, jr * 0.25, 0, jr * 0.12);
                ctx.quadraticCurveTo(-jr * 0.5, jr * 0.25, -jr, 0);
                ctx.fill();
                ctx.stroke();

                // Metallic shine highlight
                ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
                ctx.beginPath();
                ctx.ellipse(-jr * 0.35, -jr * 0.45, jr * 0.28, jr * 0.14, -0.4, 0, Math.PI * 2);
                ctx.fill();
            } else if (ent.kind === 'windy_wendy') {
                // ENEMY #3: WINDY WENDY (Powerful swirling white mist)
                const wr = 42 * s;
                for (let c = 0; c < 6; c++) {
                    const ang = ent.swirlPhase + (c / 6) * Math.PI * 2;
                    const ox = Math.cos(ang) * wr * 0.36;
                    const oy = Math.sin(ang) * wr * 0.28;
                    ctx.fillStyle = c % 2 === 0 ? 'rgba(255, 255, 255, 0.85)' : 'rgba(226, 232, 240, 0.72)';
                    ctx.beginPath();
                    ctx.arc(ox, oy, wr * 0.52, 0, Math.PI * 2);
                    ctx.fill();
                }
                // Swirling wind ribbons
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = Math.max(1.5, 3 * s);
                ctx.beginPath();
                ctx.arc(0, 0, wr * 0.78, ent.swirlPhase, ent.swirlPhase + Math.PI * 1.35);
                ctx.stroke();

                // Gusty eyes
                ctx.fillStyle = '#334155';
                ctx.beginPath();
                ctx.arc(-10 * s, -4 * s, 4 * s, 0, Math.PI * 2);
                ctx.arc(10 * s, -4 * s, 4 * s, 0, Math.PI * 2);
                ctx.fill();

                if (s > 0.18) {
                    ctx.fillStyle = '#1e293b';
                    ctx.font = `bold ${Math.max(8, Math.round(13 * s))}px Fredoka`;
                    ctx.textAlign = 'center';
                    ctx.fillText('WINDY WENDY', 0, -wr * 0.95);
                }
            } else if (ent.kind === 'pencil') {
                // ENEMY #4a: PENCIL (Yellow body, silver metal top + pink eraser, dull graphite tip)
                const pw = 18 * s;
                const ph = 72 * s;
                ctx.rotate(Math.sin(ent.pokePhase) * 0.35);

                // Pink eraser at top
                ctx.fillStyle = '#f472b6';
                ctx.fillRect(-pw * 0.5, -ph * 0.5, pw, ph * 0.14);
                // Silver metal ferrule band
                ctx.fillStyle = '#cbd5e1';
                ctx.fillRect(-pw * 0.5, -ph * 0.36, pw, ph * 0.1);
                // Yellow pencil shaft
                ctx.fillStyle = '#facc15';
                ctx.strokeStyle = '#854d0e';
                ctx.lineWidth = Math.max(1, 1.8 * s);
                ctx.fillRect(-pw * 0.5, -ph * 0.26, pw, ph * 0.54);
                ctx.strokeRect(-pw * 0.5, -ph * 0.26, pw, ph * 0.54);
                // Wooden cone + dull graphite tip
                ctx.fillStyle = '#fde68a';
                ctx.beginPath();
                ctx.moveTo(-pw * 0.5, ph * 0.28);
                ctx.lineTo(pw * 0.5, ph * 0.28);
                ctx.lineTo(0, ph * 0.5);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#334155';
                ctx.beginPath();
                ctx.arc(0, ph * 0.45, pw * 0.2, 0, Math.PI * 2);
                ctx.fill();
            } else if (ent.kind === 'eraser') {
                // ENEMY #4b: ERASER (Pink rectangle with ERASER written on top)
                const ew = 54 * s;
                const eh = 30 * s;
                ctx.rotate(Math.sin(ent.rubPhase) * 0.15);

                ctx.fillStyle = '#f472b6';
                ctx.strokeStyle = '#9d174d';
                ctx.lineWidth = Math.max(1.5, 2.5 * s);
                ctx.beginPath();
                ctx.roundRect(-ew * 0.5, -eh * 0.5, ew, eh, 5 * s);
                ctx.fill();
                ctx.stroke();

                if (s > 0.16) {
                    ctx.fillStyle = '#831843';
                    ctx.font = `bold ${Math.max(8, Math.round(12 * s))}px Fredoka`;
                    ctx.textAlign = 'center';
                    ctx.fillText('ERASER', 0, 4 * s);
                }
            } else if (ent.kind === 'failed_test') {
                // ENEMY #4c: FAILED TEST (Normal math test with 0% on it)
                const tw = 48 * s;
                const th = 62 * s;
                ctx.rotate(Math.sin(ent.flutterPhase) * 0.18);

                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#475569';
                ctx.lineWidth = Math.max(1.5, 2 * s);
                ctx.fillRect(-tw * 0.5, -th * 0.5, tw, th);
                ctx.strokeRect(-tw * 0.5, -th * 0.5, tw, th);

                // Test lines
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = Math.max(1, 1.5 * s);
                for (let l = 0; l < 3; l++) {
                    ctx.beginPath();
                    ctx.moveTo(-tw * 0.34, (l * 11) * s);
                    ctx.lineTo(tw * 0.34, (l * 11) * s);
                    ctx.stroke();
                }

                // Big Red 0% Grade
                if (s > 0.16) {
                    ctx.fillStyle = '#dc2626';
                    ctx.font = `bold ${Math.max(10, Math.round(20 * s))}px Fredoka`;
                    ctx.textAlign = 'center';
                    ctx.fillText('0%', 0, -th * 0.12);
                }
            } else if (ent.kind === 'rude_drume') {
                // ENEMY #5: RUDE DRUME (Big and shiny, pink and blue!)
                const dw = 68 * s;
                const dh = 54 * s;
                const baseY = -dh * 0.55;

                // Drum body split in glossy Pink & Blue
                ctx.fillStyle = '#ec4899';
                ctx.fillRect(-dw * 0.5, baseY - dh * 0.5, dw * 0.5, dh);
                ctx.fillStyle = '#3b82f6';
                ctx.fillRect(0, baseY - dh * 0.5, dw * 0.5, dh);

                // Shiny metallic rims
                ctx.strokeStyle = '#f8fafc';
                ctx.lineWidth = Math.max(2, 4 * s);
                ctx.strokeRect(-dw * 0.5, baseY - dh * 0.5, dw, dh);

                // Glossy vertical shine streak
                ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
                ctx.fillRect(-dw * 0.36, baseY - dh * 0.44, dw * 0.12, dh * 0.88);

                // Rude Angry Eyes & Mouth
                ctx.fillStyle = '#111827';
                ctx.beginPath();
                ctx.arc(-13 * s, baseY - 4 * s, 5 * s, 0, Math.PI * 2);
                ctx.arc(13 * s, baseY - 4 * s, 5 * s, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#111827';
                ctx.lineWidth = Math.max(2, 3 * s);
                ctx.beginPath();
                ctx.moveTo(-22 * s, baseY - 14 * s);
                ctx.lineTo(-6 * s, baseY - 8 * s);
                ctx.moveTo(22 * s, baseY - 14 * s);
                ctx.lineTo(6 * s, baseY - 8 * s);
                ctx.stroke();

                if (s > 0.18) {
                    ctx.fillStyle = '#be185d';
                    ctx.font = `bold ${Math.max(9, Math.round(15 * s))}px Fredoka`;
                    ctx.textAlign = 'center';
                    ctx.fillText('RUDE DRUME', 0, baseY - dh * 0.65);
                }
            }

            ctx.restore();
        }

        function drawGoldenKey(x, y, scale, keyNum) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            ctx.fillStyle = 'rgba(255, 224, 102, 0.35)';
            ctx.beginPath();
            ctx.arc(0, 0, 26, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffd43b';
            ctx.strokeStyle = '#7c2d12';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(0, -10, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.arc(0, -10, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffd43b';
            ctx.fillRect(-3, 0, 6, 20);
            ctx.strokeRect(-3, 0, 6, 20);
            ctx.fillRect(3, 10, 7, 4);
            ctx.fillRect(3, 16, 7, 4);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 11px Fredoka';
            ctx.textAlign = 'center';
            ctx.fillText(`KEY #${keyNum}`, 0, -25);
            ctx.restore();
        }

        function drawHallwayObstacles(cam) {
            const sorted = [...game.hallwayObstacles].sort((a, b) => b.z - a.z);
            for (const obs of sorted) {
                if (obs.z < cam.z + 15) continue;
                const p = project3D(obs.x, 0, obs.z, cam);
                const w = obs.w * p.scale;
                const h = obs.h * p.scale;

                ctx.save();
                if (obs.type === 'cone') {
                    ctx.fillStyle = '#fcc419';
                    ctx.strokeStyle = '#18181b';
                    ctx.lineWidth = Math.max(1, 2 * p.scale);
                    ctx.beginPath();
                    ctx.moveTo(p.x - w * 0.45, p.y);
                    ctx.lineTo(p.x - w * 0.16, p.y - h);
                    ctx.lineTo(p.x + w * 0.16, p.y - h);
                    ctx.lineTo(p.x + w * 0.45, p.y);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                } else if (obs.type === 'boxes') {
                    ctx.fillStyle = '#d9a066';
                    ctx.strokeStyle = '#5c3a21';
                    ctx.lineWidth = Math.max(1, 2 * p.scale);
                    ctx.fillRect(p.x - w * 0.5, p.y - h * 0.55, w, h * 0.55);
                    ctx.strokeRect(p.x - w * 0.5, p.y - h * 0.55, w, h * 0.55);
                    ctx.fillRect(p.x - w * 0.35, p.y - h, w * 0.7, h * 0.45);
                    ctx.strokeRect(p.x - w * 0.35, p.y - h, w * 0.7, h * 0.45);
                } else if (obs.type === 'bin') {
                    ctx.fillStyle = '#228be6';
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = Math.max(1, 2 * p.scale);
                    ctx.fillRect(p.x - w * 0.45, p.y - h, w * 0.9, h);
                    ctx.strokeRect(p.x - w * 0.45, p.y - h, w * 0.9, h);
                } else {
                    ctx.fillStyle = '#a47148';
                    ctx.strokeStyle = '#3e2723';
                    ctx.lineWidth = Math.max(1, 2 * p.scale);
                    ctx.fillRect(p.x - w * 0.5, p.y - h, w, h * 0.35);
                    ctx.strokeRect(p.x - w * 0.5, p.y - h, w, h * 0.35);
                    ctx.fillRect(p.x - w * 0.42, p.y - h * 0.65, w * 0.12, h * 0.65);
                    ctx.fillRect(p.x + w * 0.30, p.y - h * 0.65, w * 0.12, h * 0.65);
                }
                ctx.restore();
            }
        }

        // ==========================================
        // THIRD-PERSON OVER-THE-SHOULDER STICKMAN
        // ==========================================
        function drawOverTheShoulderStickman(cam) {
            if (game.mode === 'finale_bus' && game.finaleTimer > 165) return;

            const groundP = project3D(player.x, 0, player.z, cam);
            const playerP = project3D(player.x, player.y, player.z, cam);
            const s = playerP.scale * 1.38;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.32)';
            ctx.beginPath();
            ctx.ellipse(groundP.x, groundP.y, 18 * groundP.scale, 6 * groundP.scale, 0, 0, Math.PI * 2);
            ctx.fill();

            if (player.invulnTimer > 0 && player.bubbleTimer <= 0 && Math.floor(player.invulnTimer / 4) % 2 === 1) {
                return;
            }

            const hipX = playerP.x;
            const hipY = playerP.y - 22 * s;
            const neckY = hipY - 26 * s;
            const headRadius = 9.5 * s;
            const headY = neckY - headRadius;
            const shoulderY = neckY + 5 * s;

            ctx.save();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = Math.max(4, 6.5 * s);
            drawStickmanSkeleton(hipX, hipY, neckY, headY, headRadius, shoulderY, s);

            ctx.strokeStyle = '#111827';
            ctx.fillStyle = '#111827';
            ctx.lineWidth = Math.max(2.5, 4.2 * s);
            drawStickmanSkeleton(hipX, hipY, neckY, headY, headRadius, shoulderY, s);

            // Backpack
            ctx.fillStyle = '#e03131';
            ctx.strokeStyle = '#111827';
            ctx.lineWidth = Math.max(1.5, 2.2 * s);
            ctx.beginPath();
            ctx.roundRect(hipX - 8 * s, shoulderY + 1 * s, 16 * s, 19 * s, 4 * s);
            ctx.fill();
            ctx.stroke();

            // If trapped in Door #2's seawater bubble for 3 seconds, render bubble around Stickman!
            if (player.bubbleTimer > 0) {
                const br = 36 * s;
                ctx.fillStyle = 'rgba(56, 189, 248, 0.36)';
                ctx.strokeStyle = '#7dd3fc';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(hipX, hipY - 12 * s, br, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 14px Fredoka';
                ctx.textAlign = 'center';
                ctx.fillText(`TRAPPED: ${(player.bubbleTimer / 60).toFixed(1)}s`, hipX, headY - 20 * s);
            }

            // Show floating key beside Stickman when carrying it out
            if (game.carryingRoomKey) {
                drawGoldenKey(hipX + 24 * s, shoulderY - 8 * s, s * 0.72, game.activeRoomId);
            }

            ctx.restore();
        }

        function drawStickmanSkeleton(hipX, hipY, neckY, headY, headRadius, shoulderY, s) {
            const legSwing = Math.sin(player.walkFrame) * 6 * s;
            const armSwing = Math.sin(player.walkFrame + Math.PI) * 5 * s;

            // Head
            ctx.beginPath();
            ctx.arc(hipX, headY, headRadius, 0, Math.PI * 2);
            ctx.stroke();

            // Torso
            ctx.beginPath();
            ctx.moveTo(hipX, neckY);
            ctx.lineTo(hipX, hipY);
            ctx.stroke();

            // Left Leg (only if not erased by Door #4 Eraser!)
            if (player.limbs.leftLeg) {
                ctx.beginPath();
                ctx.moveTo(hipX - 3 * s, hipY);
                ctx.lineTo(hipX - 6 * s, hipY + 21 * s + legSwing * 0.5);
                ctx.stroke();
            }

            // Right Leg
            if (player.limbs.rightLeg) {
                ctx.beginPath();
                ctx.moveTo(hipX + 3 * s, hipY);
                ctx.lineTo(hipX + 6 * s, hipY + 21 * s - legSwing * 0.5);
                ctx.stroke();
            }

            // Left Arm
            if (player.limbs.leftArm) {
                ctx.beginPath();
                ctx.moveTo(hipX - 4 * s, shoulderY);
                ctx.lineTo(hipX - 13 * s, shoulderY + 15 * s - armSwing * 0.5);
                ctx.stroke();
            }

            // Right Arm
            if (player.limbs.rightArm) {
                ctx.beginPath();
                ctx.moveTo(hipX + 4 * s, shoulderY);
                ctx.lineTo(hipX + 13 * s, shoulderY + 15 * s + armSwing * 0.5);
                ctx.stroke();
            }
        }

        // ==========================================
        // BANNERS & MODALS (TOKENS / WIN / LOSE)
        // ==========================================
        function drawOverlays() {
            if (game.bannerTimer > 0 && (game.mode === 'hallway' || game.mode === 'room')) {
                const bw = Math.min(canvas.width - 36, 840);
                const bx = (canvas.width - bw) * 0.5;
                ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
                ctx.strokeStyle = '#ffd43b';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(bx, 12, bw, 38, 8);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 13px Outfit';
                ctx.textAlign = 'center';
                ctx.fillText(game.bannerText, canvas.width * 0.5, 36);
            }

            if (game.mode === 'room' && game.carryingRoomKey) {
                ctx.fillStyle = 'rgba(21, 128, 61, 0.94)';
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(canvas.width * 0.5 - 240, canvas.height - 54, 480, 36, 8);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 14px Fredoka';
                ctx.textAlign = 'center';
                ctx.fillText('KEY COLLECTED! HOLD [S] TO RUN OUT THE EXIT DOOR!', canvas.width * 0.5, canvas.height - 31);
            }

            // ROOM CHALLENGE FAILED MODAL
            if (game.mode === 'room_fail') {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const mw = 560;
                const mh = 275;
                const mx = (canvas.width - mw) * 0.5;
                const my = (canvas.height - mh) * 0.5;

                ctx.fillStyle = '#1e293b';
                ctx.strokeStyle = '#f43f5e';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.roundRect(mx, my, mw, mh, 12);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#fb7185';
                ctx.font = 'bold 26px Fredoka';
                ctx.textAlign = 'center';
                ctx.fillText('OUT OF HEARTS — REPEAT LEVEL!', canvas.width * 0.5, my + 48);

                ctx.fillStyle = '#e2e8f0';
                ctx.font = 'bold 14px Outfit';
                ctx.fillText(`Found Tokens Available: ${game.tokens} / ${game.maxTokens}`, canvas.width * 0.5, my + 84);

                if (game.tokens > 0) {
                    ctx.fillStyle = '#6ee7b7';
                    ctx.fillText('Press [T] to spend a found Token & clear this room, or Retry [R]!', canvas.width * 0.5, my + 118);
                } else {
                    ctx.fillStyle = '#fca5a5';
                    ctx.fillText('You have 0 Tokens! (Find the 2 hidden Tokens in the hallway!)', canvas.width * 0.5, my + 118);
                }

                drawModalButton(mx + 45, my + 165, 215, 48, '#3b82f6', 'REPEAT LEVEL [R]');
                if (game.tokens > 0) {
                    drawModalButton(mx + 300, my + 165, 215, 48, '#10b981', `USE TOKEN [T] (${game.tokens})`);
                } else {
                    drawModalButton(mx + 300, my + 165, 215, 48, '#ef4444', 'GIVE UP RUN');
                }
            }

            // VICTORY SCREEN (Escaped on the Yellow School Bus!)
            if (game.mode === 'victory') {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.84)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const mw = 560;
                const mh = 260;
                const mx = (canvas.width - mw) * 0.5;
                const my = (canvas.height - mh) * 0.5;

                ctx.fillStyle = '#1e293b';
                ctx.strokeStyle = '#fcc419';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.roundRect(mx, my, mw, mh, 12);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#fcc419';
                ctx.font = 'bold 28px Fredoka';
                ctx.textAlign = 'center';
                ctx.fillText('YOU ESCAPED THE SHCOOL!', canvas.width * 0.5, my + 52);

                ctx.fillStyle = '#ffffff';
                ctx.font = '14px Outfit';
                ctx.fillText('You inserted all 5 keys into the Giant 5-Keyhole Door', canvas.width * 0.5, my + 95);
                ctx.fillText('and boarded the Yellow School Bus to freedom!', canvas.width * 0.5, my + 120);

                drawModalButton(canvas.width * 0.5 - 110, my + 175, 220, 46, '#fcc419', 'PLAY AGAIN [R]', '#111827');
            }

            // GAME OVER SCREEN
            if (game.mode === 'gameover') {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const mw = 520;
                const mh = 240;
                const mx = (canvas.width - mw) * 0.5;
                const my = (canvas.height - mh) * 0.5;

                ctx.fillStyle = '#1e293b';
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.roundRect(mx, my, mw, mh, 12);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#ef4444';
                ctx.font = 'bold 26px Fredoka';
                ctx.textAlign = 'center';
                ctx.fillText('TRAPPED IN THE SHCOOL!', canvas.width * 0.5, my + 54);

                ctx.fillStyle = '#e2e8f0';
                ctx.font = '14px Outfit';
                ctx.fillText(`Keys Collected: ${getCollectedKeyCount()} / 5`, canvas.width * 0.5, my + 102);

                drawModalButton(canvas.width * 0.5 - 110, my + 155, 220, 46, '#ef4444', 'TRY AGAIN [R]');
            }
        }

        function drawModalButton(x, y, w, h, bg, label, textColor = '#ffffff') {
            ctx.fillStyle = bg;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 8);
            ctx.fill();

            ctx.fillStyle = textColor;
            ctx.font = 'bold 14px Fredoka';
            ctx.textAlign = 'center';
            ctx.fillText(label, x + w * 0.5, y + h * 0.5 + 5);
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const cx = (e.clientX - rect.left) * scaleX;
            const cy = (e.clientY - rect.top) * scaleY;

            if (game.mode === 'room_fail') {
                const mw = 560, mh = 275;
                const mx = (canvas.width - mw) * 0.5;
                const my = (canvas.height - mh) * 0.5;
                if (cy >= my + 165 && cy <= my + 213) {
                    if (cx >= mx + 45 && cx <= mx + 260) {
                        retryCurrentRoom();
                    } else if (cx >= mx + 300 && cx <= mx + 515) {
                        if (game.tokens > 0) useEscapeToken();
                        else giveUpRun();
                    }
                }
            } else if (game.mode === 'victory' || game.mode === 'gameover') {
                resetSimulation();
            }
        });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            if (game.screenShake > 0) {
                const sx = (Math.random() - 0.5) * game.screenShake;
                const sy = (Math.random() - 0.5) * game.screenShake;
                ctx.translate(sx, sy);
            }

            const cam = createCamera();

            if (game.mode === 'hallway' || game.mode === 'finale_bus' || game.mode === 'victory') {
                drawHallwayEnvironment(cam);
                drawHallwayObstacles(cam);
            } else {
                drawClassroomEnvironment(cam);
            }

            drawOverTheShoulderStickman(cam);
            ctx.restore();

            drawOverlays();
        }

        function animate() {
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            resizeCanvas();
            resetSimulation();
            animate();
        };
    </script>
</body>
</html>
