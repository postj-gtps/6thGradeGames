<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Different Planets — Scull / Team 1</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 12px 16px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1140px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ffffff;
            gap: 10px;
        }

        h1 {
            font-size: 17px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-ui {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
        }

        .btn-ui:hover {
            background: #ffffff;
            color: #000000;
        }

        .btn-shop {
            border-color: #ffd700;
            color: #ffd700;
        }

        .btn-shop:hover {
            background: #ffd700;
            color: #000000;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1140px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #04050c;
            border: 1px solid #ffffff;
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .instructions {
            margin-top: 8px;
            font-size: 12px;
            color: #bbbbbb;
            text-align: center;
            letter-spacing: 0.4px;
        }

        .instructions span {
            color: #ffd700;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Astronaut: Different Planets (10 Levels)</h1>
        <div class="header-actions">
            <button class="btn-ui btn-shop" onclick="toggleShop()">[B] Power-Up Shop</button>
            <button class="btn-ui" onclick="resetSimulation()">Reset</button>
        </div>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions">
        <span>[WASD]</span> Move Astronaut &nbsp;|&nbsp;
        <span>[SPACE]</span> Big Beam / Fire &nbsp;|&nbsp;
        <span>[CLICK]</span> Capture Orb &nbsp;|&nbsp;
        <span>[Q]</span> Phase Dash (5s) &nbsp;|&nbsp;
        <span>[E]</span> FOR SCIENCE (1/Game) &nbsp;|&nbsp;
        <span>[B]</span> Shop
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // KEYBOARD & MOUSE INPUT STATE
        const keys = {};
        const mouse = { x: 0, y: 0, active: false };

        // 10 DISTINCT PLANETS & SCENERY THEMES
        const PLANETS = [
            {
                level: 1,
                name: 'LEVEL 1: CRATERON-7 (ROCKY CRATERS)',
                spaceTop: '#03040a',
                spaceBottom: '#0c1022',
                groundFill: '#242734',
                groundRim: '#525875',
                craterDark: '#12131b',
                craterRim: '#626885',
                rockColor: '#3b3f52',
                rockHighlight: '#707796',
                distantPlanetColor: '#4e6fae',
                sceneryType: 'craters',
                lavaSpeedMult: 1.0,
                isRush: false
            },
            {
                level: 2,
                name: 'LEVEL 2: PYROSIA (MAGMA CRATERS)',
                spaceTop: '#090306',
                spaceBottom: '#1f080e',
                groundFill: '#2f191d',
                groundRim: '#69343c',
                craterDark: '#19090c',
                craterRim: '#87424b',
                rockColor: '#4a2429',
                rockHighlight: '#914952',
                distantPlanetColor: '#e06834',
                sceneryType: 'magma',
                lavaSpeedMult: 1.25,
                isRush: false
            },
            {
                level: 3,
                name: 'LEVEL 3: DIAMONDIA (DIAMOND WORLD)',
                spaceTop: '#020814',
                spaceBottom: '#071b36',
                groundFill: '#122947',
                groundRim: '#4ce8ff',
                craterDark: '#091629',
                craterRim: '#38bdf8',
                rockColor: '#1c3e6b',
                rockHighlight: '#80f5ff',
                distantPlanetColor: '#5ce1e6',
                sceneryType: 'diamonds',
                lavaSpeedMult: 1.35,
                isRush: false
            },
            {
                level: 4,
                name: 'LEVEL 4: AURUM-9 (SHINY GOLD WORLD)',
                spaceTop: '#0a0702',
                spaceBottom: '#211705',
                groundFill: '#38290b',
                groundRim: '#ffd700',
                craterDark: '#1c1404',
                craterRim: '#f5b700',
                rockColor: '#594212',
                rockHighlight: '#ffe866',
                distantPlanetColor: '#ffca28',
                sceneryType: 'gold',
                lavaSpeedMult: 1.45,
                isRush: false
            },
            {
                level: 5,
                name: 'LEVEL 5: ENEMY RUSH — ASTEROID BELT!',
                spaceTop: '#120208',
                spaceBottom: '#290612',
                groundFill: '#2b1620',
                groundRim: '#ff3b6b',
                craterDark: '#14080e',
                craterRim: '#c92a52',
                rockColor: '#472132',
                rockHighlight: '#ff668c',
                distantPlanetColor: '#ff2e63',
                sceneryType: 'rush',
                lavaSpeedMult: 1.5,
                isRush: true
            },
            {
                level: 6,
                name: 'LEVEL 6: EMERALD NEBULA',
                spaceTop: '#020b07',
                spaceBottom: '#072417',
                groundFill: '#123323',
                groundRim: '#34d399',
                craterDark: '#081a11',
                craterRim: '#10b981',
                rockColor: '#1b4d35',
                rockHighlight: '#6ee7b7',
                distantPlanetColor: '#38c99b',
                sceneryType: 'emeralds',
                lavaSpeedMult: 1.6,
                isRush: false
            },
            {
                level: 7,
                name: 'LEVEL 7: OBSIDIAN RIFT',
                spaceTop: '#06020d',
                spaceBottom: '#15072b',
                groundFill: '#1a1229',
                groundRim: '#a855f7',
                craterDark: '#0b0714',
                craterRim: '#7e22ce',
                rockColor: '#291b42',
                rockHighlight: '#c084fc',
                distantPlanetColor: '#9333ea',
                sceneryType: 'obsidian',
                lavaSpeedMult: 1.75,
                isRush: false
            },
            {
                level: 8,
                name: 'LEVEL 8: DIAMOND-GOLD DUALITY',
                spaceTop: '#040814',
                spaceBottom: '#1a1508',
                groundFill: '#1b2838',
                groundRim: '#ffd700',
                craterDark: '#0c121c',
                craterRim: '#4ce8ff',
                rockColor: '#2c3e54',
                rockHighlight: '#ffe066',
                distantPlanetColor: '#67e8f9',
                sceneryType: 'diamond_gold',
                lavaSpeedMult: 1.85,
                isRush: false
            },
            {
                level: 9,
                name: 'LEVEL 9: SOLAR INFERNO',
                spaceTop: '#0f0401',
                spaceBottom: '#2b0d03',
                groundFill: '#3b1708',
                groundRim: '#fb923c',
                craterDark: '#1c0902',
                craterRim: '#f97316',
                rockColor: '#59230c',
                rockHighlight: '#fdba74',
                distantPlanetColor: '#ff6b00',
                sceneryType: 'magma',
                lavaSpeedMult: 2.0,
                isRush: false
            },
            {
                level: 10,
                name: 'LEVEL 10: FINAL ENEMY RUSH — XENO THRONE!',
                spaceTop: '#090314',
                spaceBottom: '#241804',
                groundFill: '#292012',
                groundRim: '#ffd700',
                craterDark: '#120d06',
                craterRim: '#ff2a6d',
                rockColor: '#45351a',
                rockHighlight: '#7ef9ff',
                distantPlanetColor: '#ffd700',
                sceneryType: 'diamond_gold',
                lavaSpeedMult: 2.1,
                isRush: true
            }
        ];

        // SHOP ITEMS (10 Coins per defeated alien)
        const SHOP_ITEMS = [
            {
                id: 'beam',
                name: 'Big Beam Charge (+1)',
                desc: 'Adds +1 Big Beam laser [SPACE] (75% enemy HP)',
                cost: 20,
                buy: () => {
                    player.bigBeamCharges += 1;
                }
            },
            {
                id: 'heal',
                name: 'Astronaut Medkit (+40 HP)',
                desc: 'Restores 40 HP & cleanses Space Bug swarm',
                cost: 15,
                buy: () => {
                    player.hp = Math.min(player.maxHp, player.hp + 40);
                    game.roundSeconds = Math.max(0, game.roundSeconds - 12);
                }
            },
            {
                id: 'blaster',
                name: 'Hyper Capture Orb (2x DMG)',
                desc: 'Capture Orbs deal 2x damage permanently',
                cost: 30,
                once: true,
                bought: false,
                buy: function() {
                    player.orbDamage = 2;
                    this.bought = true;
                }
            },
            {
                id: 'phase_cd',
                name: 'Quantum Phase Core (3s CD)',
                desc: 'Cuts Phase [Q] cooldown from 5s down to 3s',
                cost: 25,
                once: true,
                bought: false,
                buy: function() {
                    player.phaseMaxCooldown = 3.0;
                    player.phaseCooldown = Math.min(player.phaseCooldown, 3.0);
                    this.bought = true;
                }
            },
            {
                id: 'bug_shield',
                name: 'Anti-Bug Space Suit',
                desc: 'Reduces Space Bugs damage buildup by 50%',
                cost: 25,
                once: true,
                bought: false,
                buy: function() {
                    player.bugResistance = 0.5;
                    this.bought = true;
                }
            },
            {
                id: 'max_hp',
                name: 'Reinforced Spacesuit (+25 Max HP)',
                desc: 'Increases Max HP by 25 and heals +25 HP',
                cost: 30,
                buy: () => {
                    player.maxHp += 25;
                    player.hp = Math.min(player.maxHp, player.hp + 25);
                }
            }
        ];

        // GAME STATE
        const game = {
            level: 1,
            maxLevels: 10,
            state: 'PLAYING', // 'PLAYING', 'LEVEL_CLEAR', 'GAME_OVER', 'VICTORY'
            shopOpen: false,
            loseReason: '',
            frame: 0,
            lastTimestamp: 0,
            roundSeconds: 0,
            bugTickAccum: 0,
            rushTimeLeft: 30.0,
            shakeTimer: 0,
            shakeIntensity: 0,
            bannerTimer: 0,
            bannerText: '',
            stars: [],
            sceneryProps: [], // Diamonds, shiny gold nuggets, crystals
            craters: [],
            rocks: [],
            enemies: [],
            projectiles: [],
            enemyProjectiles: [],
            beams: [],
            scienceWaves: [],
            particles: [],
            popups: [],
            ship: {
                x: 0,
                y: 0,
                radius: 42,
                unlocked: false
            },
            totalAliens: 0,
            capturedAliens: 0
        };

        // ASTRONAUT STICKMAN PLAYER STATE
        const player = {
            x: 0,
            y: 0,
            speed: 4.6,
            facing: 1,
            aimAngle: 0,
            walkFrame: 0,
            hp: 100,
            maxHp: 100,
            coins: 0,
            invulnTimer: 0,
            shootCooldown: 0,
            orbDamage: 1,
            // Powers
            bigBeamCharges: 1,      // 1 per round (+ shop extras)
            forScienceUsed: false,  // Only once per game!
            phaseActiveTimer: 0,    // Invulnerable dash duration
            phaseCooldown: 0,       // 5 seconds cooldown
            phaseMaxCooldown: 5.0,
            phaseDirX: 1,
            phaseDirY: 0,
            phaseTrail: [],
            bugResistance: 1.0,
            x2HitCount: 0           // Tracks X 2 hits (1st = 99% HP, 2nd = instant defeat)
        };

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            const prevW = canvas.width;
            const prevH = canvas.height;
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;

            if (prevW === 0 || prevH === 0) {
                resetSimulation();
            } else {
                player.x = Math.max(40, Math.min(canvas.width - 40, player.x));
                player.y = Math.max(85, Math.min(canvas.height - 40, player.y));
                game.ship.x = Math.min(canvas.width - 75, Math.max(100, game.ship.x));
                game.ship.y = Math.max(120, Math.min(canvas.height - 75, game.ship.y));
            }
        }

        window.addEventListener('resize', resizeCanvas);

        // CONTROLS HANDLERS (Exclusive WASD + Space/Click + Q + E + B)
        window.addEventListener('keydown', (e) => {
            if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                e.preventDefault();
            }
            keys[e.code] = true;

            if (e.code === 'KeyB') {
                if (game.state === 'PLAYING' || game.state === 'LEVEL_CLEAR') {
                    toggleShop();
                }
                return;
            }

            if (e.code === 'Escape' && game.shopOpen) {
                game.shopOpen = false;
                return;
            }

            // Number shortcuts 1-6 while shop is open
            if (game.shopOpen && e.code.startsWith('Digit')) {
                const idx = parseInt(e.code.replace('Digit', ''), 10) - 1;
                if (idx >= 0 && idx < SHOP_ITEMS.length) {
                    purchaseShopItem(idx);
                }
                return;
            }

            if (game.shopOpen) return;

            if (e.code === 'Space') {
                if (game.state === 'PLAYING') {
                    if (player.bigBeamCharges > 0) {
                        fireBigBeam();
                    } else {
                        fireCaptureOrb(false);
                    }
                } else if (game.state === 'LEVEL_CLEAR') {
                    advanceNextPlanet();
                } else if (game.state === 'GAME_OVER' || game.state === 'VICTORY') {
                    resetSimulation();
                }
            }

            if (e.code === 'KeyQ' && game.state === 'PLAYING') {
                activatePhase();
            }

            if (e.code === 'KeyE' && game.state === 'PLAYING') {
                activateForScience();
            }

            if (e.code === 'KeyR' && (game.state === 'GAME_OVER' || game.state === 'VICTORY')) {
                resetSimulation();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        window.addEventListener('blur', () => {
            for (const k in keys) keys[k] = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
            mouse.active = true;
        });

        canvas.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
            mouse.active = true;

            if (game.shopOpen) {
                handleShopClick(mouse.x, mouse.y);
                return;
            }

            if (game.state === 'PLAYING') {
                fireCaptureOrb(true);
            } else if (game.state === 'LEVEL_CLEAR') {
                advanceNextPlanet();
            } else if (game.state === 'GAME_OVER' || game.state === 'VICTORY') {
                resetSimulation();
            }
        });

        function getPlanetTheme(level) {
            return PLANETS[(level - 1) % PLANETS.length];
        }

        function dist(x1, y1, x2, y2) {
            return Math.hypot(x2 - x1, y2 - y1);
        }

        function generateStars() {
            game.stars = [];
            const starColors = ['#ffffff', '#ffe9c4', '#c4dfff', '#ffd1dc', '#b8f2e6'];
            for (let i = 0; i < 120; i++) {
                game.stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2.1 + 0.5,
                    twinkleSpeed: Math.random() * 0.05 + 0.015,
                    phase: Math.random() * Math.PI * 2,
                    color: starColors[Math.floor(Math.random() * starColors.length)]
                });
            }
        }

        function generateSceneryProps(theme) {
            game.sceneryProps = [];
            const count = 26;
            for (let i = 0; i < count; i++) {
                const px = 45 + Math.random() * (canvas.width - 90);
                const py = 95 + Math.random() * (canvas.height - 135);
                let kind = 'pebble';
                if (theme.sceneryType === 'diamonds') kind = 'diamond';
                else if (theme.sceneryType === 'gold') kind = 'gold';
                else if (theme.sceneryType === 'emeralds') kind = 'emerald';
                else if (theme.sceneryType === 'diamond_gold') kind = i % 2 === 0 ? 'diamond' : 'gold';
                else if (theme.sceneryType === 'obsidian') kind = 'crystal_purple';
                else kind = 'pebble';

                game.sceneryProps.push({
                    x: px,
                    y: py,
                    size: 5 + Math.random() * 6,
                    kind,
                    shimmerPhase: Math.random() * Math.PI * 2
                });
            }
        }

        function initLevel(levelNum) {
            game.level = levelNum;
            game.state = 'PLAYING';
            game.shopOpen = false;
            game.loseReason = '';
            game.roundSeconds = 0;
            game.bugTickAccum = 0;
            game.projectiles = [];
            game.enemyProjectiles = [];
            game.beams = [];
            game.scienceWaves = [];
            game.particles = [];
            game.popups = [];
            game.capturedAliens = 0;

            const theme = getPlanetTheme(levelNum);
            game.rushTimeLeft = theme.isRush ? 30.0 : 0;

            // Reset per-round power (Big Beam: 1 time per round)
            player.bigBeamCharges = Math.max(1, player.bigBeamCharges);
            player.x = Math.min(125, canvas.width * 0.13);
            player.y = canvas.height * 0.56;
            player.facing = 1;
            player.aimAngle = 0;
            player.walkFrame = 0;
            player.invulnTimer = 60;
            player.shootCooldown = 0;
            player.phaseActiveTimer = 0;
            player.phaseTrail = [];

            // Alien Ship location
            game.ship.x = canvas.width - Math.min(125, canvas.width * 0.13);
            game.ship.y = Math.max(140, canvas.height * 0.28);
            game.ship.unlocked = false;

            generateStars();
            generateSceneryProps(theme);

            // Generate Rocky Boulders
            game.rocks = [];
            const rockCount = 4 + Math.min(4, Math.floor(levelNum / 2));
            for (let i = 0; i < rockCount; i++) {
                const rx = canvas.width * (0.28 + (i % 4) * 0.16) + (Math.random() * 34 - 17);
                const ry = canvas.height * (0.28 + Math.floor(i / 4) * 0.42) + (Math.random() * 34 - 17);
                if (dist(rx, ry, player.x, player.y) < 120 || dist(rx, ry, game.ship.x, game.ship.y) < 130) {
                    continue;
                }
                game.rocks.push({
                    x: rx,
                    y: ry,
                    r: 18 + Math.random() * 6,
                    seed: Math.random() * 10,
                    gemType: theme.sceneryType
                });
            }

            // Generate Rocky Craters with random rising lava (harder on higher planets!)
            game.craters = [];
            const craterCount = Math.min(11, 5 + Math.floor(levelNum * 0.7));
            let attempts = 0;
            while (game.craters.length < craterCount && attempts < 140) {
                attempts++;
                const r = 23 + Math.random() * 15;
                const cx = 75 + Math.random() * (canvas.width - 150);
                const cy = 100 + Math.random() * (canvas.height - 160);

                if (dist(cx, cy, player.x, player.y) < 120) continue;
                if (dist(cx, cy, game.ship.x, game.ship.y) < 125) continue;
                if (game.rocks.some(rk => dist(cx, cy, rk.x, rk.y) < r + rk.r + 18)) continue;
                if (game.craters.some(cr => dist(cx, cy, cr.x, cr.y) < r + cr.r + 28)) continue;

                game.craters.push({
                    x: cx,
                    y: cy,
                    r: r,
                    state: 'DORMANT',
                    lavaRise: 0,
                    timer: Math.floor((80 + Math.random() * 210) / theme.lavaSpeedMult)
                });
            }

            // Build Enemy Roster per Level (scaling difficulty across all 10 levels!)
            game.enemies = [];
            const spawnList = [];
            if (levelNum === 1) {
                spawnList.push('dicer', 'chocolate', 'Jon', 'Jon');
            } else if (levelNum === 2) {
                spawnList.push('dicer', 'chocolate', 'chocolate', 'Jon', 'Jon');
            } else if (levelNum === 3) {
                spawnList.push('dicer', 'chocolate', 'Jon', 'x2');
            } else if (levelNum === 4) {
                spawnList.push('dicer', 'dicer', 'chocolate', 'chocolate', 'Jon', 'x2');
            } else if (levelNum === 5) {
                // ENEMY RUSH (30 seconds!)
                spawnList.push('dicer', 'dicer', 'chocolate', 'chocolate', 'chocolate', 'Jon', 'Jon', 'Jon');
            } else if (levelNum === 6) {
                spawnList.push('dicer', 'dicer', 'chocolate', 'chocolate', 'Jon', 'Jon', 'x2');
            } else if (levelNum === 7) {
                spawnList.push('dicer', 'dicer', 'chocolate', 'chocolate', 'Jon', 'x2', 'x2');
            } else if (levelNum === 8) {
                spawnList.push('dicer', 'dicer', 'chocolate', 'chocolate', 'chocolate', 'Jon', 'Jon', 'x2');
            } else if (levelNum === 9) {
                spawnList.push('dicer', 'dicer', 'dicer', 'chocolate', 'chocolate', 'Jon', 'Jon', 'x2', 'x2');
            } else {
                // LEVEL 10: FINAL ENEMY RUSH (30 seconds!)
                spawnList.push('dicer', 'dicer', 'chocolate', 'chocolate', 'chocolate', 'Jon', 'Jon', 'x2', 'x2');
            }

            spawnList.forEach((type, idx) => {
                let ex = canvas.width * 0.62;
                let ey = canvas.height * 0.5;
                for (let tries = 0; tries < 90; tries++) {
                    const tx = 140 + Math.random() * (canvas.width - 210);
                    const ty = 105 + Math.random() * (canvas.height - 165);
                    if (dist(tx, ty, player.x, player.y) > 210 &&
                        !game.rocks.some(rk => dist(tx, ty, rk.x, rk.y) < rk.r + 32)) {
                        ex = tx;
                        ey = ty;
                        break;
                    }
                }
                game.enemies.push(createEnemy(type, ex, ey, idx));
            });

            game.totalAliens = game.enemies.length;
            if (theme.isRush) {
                showBanner(`⚠ ENEMY RUSH! DEFEAT ALL ${game.totalAliens} ALIENS IN 30 SECONDS! ⚠`, 190);
            } else {
                showBanner(`${theme.name} — CAPTURE ALL ${game.totalAliens} ALIENS!`, 150);
            }
        }

        function createEnemy(type, x, y, idx) {
            const levelScale = 1 + (game.level - 1) * 0.04;

            if (type === 'dicer') {
                // Stationary trap / turret, Slow (Easy to dodge), turns itself every time it shoots, 1-6 damage
                return {
                    type: 'dicer',
                    name: 'dicer',
                    x,
                    y,
                    radius: 20,
                    speed: 0, // Stationary turret
                    hp: 3,
                    maxHp: 3,
                    faceValue: Math.floor(Math.random() * 6) + 1,
                    shootTimer: 75 + (idx * 25) % 60,
                    spinTimer: 0,
                    spinAngle: 0,
                    hitFlash: 0
                };
            }

            if (type === 'x2') {
                // Red triangle head with a cloak and 4 hands that shoot energy orbs and spawns mini x's
                // Float or bounce up and down, Fast (Tricky!), 99% HP on 1st hit, instant defeat on 2nd hit
                return {
                    type: 'x2',
                    name: 'X 2',
                    x,
                    y,
                    baseY: y,
                    radius: 26,
                    speed: 3.6 * levelScale,
                    hp: 8,
                    maxHp: 8,
                    vx: (idx % 2 === 0 ? -1 : 1) * 2.8,
                    vy: 2.3,
                    floatPhase: idx * 1.1,
                    orbShootTimer: 95 + idx * 20,
                    spawnMiniTimer: 210 + idx * 35,
                    hitFlash: 0
                };
            }

            if (type === 'mini_x') {
                // Spawned by X 2!
                const ang = Math.random() * Math.PI * 2;
                return {
                    type: 'mini_x',
                    name: 'mini x',
                    x,
                    y,
                    radius: 12,
                    speed: 3.4,
                    hp: 1,
                    maxHp: 1,
                    vx: Math.cos(ang) * 3.4,
                    vy: Math.sin(ang) * 3.4,
                    bouncePhase: Math.random() * Math.PI * 2,
                    hitFlash: 0
                };
            }

            if (type === 'chocolate') {
                // Looks like a chocolate bar with alien eyes, Patrol back and forth (Left/Right), Fast, 10 HP damage
                const dir = idx % 2 === 0 ? 1 : -1;
                return {
                    type: 'chocolate',
                    name: 'Chocolate',
                    x,
                    y,
                    radius: 20,
                    speed: 4.1 * levelScale, // Fast (Tricky!)
                    hp: 3,
                    maxHp: 3,
                    vx: dir * 4.1 * levelScale,
                    vy: 0,
                    wobble: idx * 0.9,
                    hitFlash: 0
                };
            }

            // Jon: green, one eye, short, Chase Stickman when nearby, Medium pace, lose 5 HP
            return {
                type: 'Jon',
                name: 'Jon',
                x,
                y,
                radius: 16,
                speed: 2.45 * levelScale, // Medium (Normal pace)
                hp: 2,
                maxHp: 2,
                vx: 0,
                vy: 0,
                wanderAngle: Math.random() * Math.PI * 2,
                hopPhase: idx * 1.4,
                hitFlash: 0
            };
        }

        function resetSimulation() {
            player.hp = 100;
            player.maxHp = 100;
            player.coins = 0;
            player.orbDamage = 1;
            player.bigBeamCharges = 1;
            player.forScienceUsed = false;
            player.phaseActiveTimer = 0;
            player.phaseCooldown = 0;
            player.phaseMaxCooldown = 5.0;
            player.bugResistance = 1.0;
            player.x2HitCount = 0;

            SHOP_ITEMS.forEach(item => {
                if (item.once) item.bought = false;
            });

            initLevel(1);
        }

        function advanceNextPlanet() {
            player.hp = Math.min(player.maxHp, player.hp + 20);
            player.bigBeamCharges = Math.max(1, player.bigBeamCharges);
            initLevel(game.level + 1);
        }

        function toggleShop() {
            if (game.state !== 'PLAYING' && game.state !== 'LEVEL_CLEAR') return;
            game.shopOpen = !game.shopOpen;
        }

        function purchaseShopItem(index) {
            const item = SHOP_ITEMS[index];
            if (!item) return;
            if (item.once && item.bought) {
                addPopup(canvas.width / 2, canvas.height / 2 - 140, 'ALREADY OWNED!', '#ffae00');
                return;
            }
            if (player.coins < item.cost) {
                addPopup(canvas.width / 2, canvas.height / 2 - 140, 'NOT ENOUGH COINS!', '#ff4d4d');
                return;
            }
            player.coins -= item.cost;
            item.buy();
            spawnParticles(player.x, player.y - 10, '#ffd700', 18, 1.3);
            addPopup(player.x, player.y - 30, `BOUGHT: ${item.name}`, '#ffd700');
        }

        function handleShopClick(mx, my) {
            const panelW = Math.min(680, canvas.width - 40);
            const panelH = 420;
            const px = (canvas.width - panelW) / 2;
            const py = (canvas.height - panelH) / 2;

            // Close button top-right of modal
            if (mx >= px + panelW - 95 && mx <= px + panelW - 16 && my >= py + 14 && my <= py + 42) {
                game.shopOpen = false;
                return;
            }

            // Check item rows
            const startY = py + 76;
            const rowH = 52;
            for (let i = 0; i < SHOP_ITEMS.length; i++) {
                const ry = startY + i * rowH;
                if (mx >= px + 20 && mx <= px + panelW - 20 && my >= ry && my <= ry + rowH - 6) {
                    purchaseShopItem(i);
                    return;
                }
            }
        }

        function showBanner(text, duration) {
            game.bannerText = text;
            game.bannerTimer = duration;
        }

        function addPopup(x, y, text, color) {
            game.popups.push({
                x,
                y,
                text,
                color,
                life: 58,
                maxLife: 58
            });
        }

        function spawnParticles(x, y, color, count, speedScale = 1) {
            for (let i = 0; i < count; i++) {
                const ang = Math.random() * Math.PI * 2;
                const spd = (1 + Math.random() * 3.3) * speedScale;
                game.particles.push({
                    x,
                    y,
                    vx: Math.cos(ang) * spd,
                    vy: Math.sin(ang) * spd,
                    size: 2 + Math.random() * 3,
                    color,
                    life: 22 + Math.floor(Math.random() * 20),
                    maxLife: 42
                });
            }
        }

        function damagePlayer(amount, reason, knockX = 0, knockY = 0, bypassInvuln = false) {
            if (game.state !== 'PLAYING') return;
            // Invulnerable while phasing!
            if (player.phaseActiveTimer > 0) return;
            if (!bypassInvuln && player.invulnTimer > 0) return;

            player.hp = Math.max(0, player.hp - amount);
            if (!bypassInvuln) {
                player.invulnTimer = 48;
                game.shakeTimer = 14;
                game.shakeIntensity = 6;
                player.x = Math.max(25, Math.min(canvas.width - 25, player.x + knockX));
                player.y = Math.max(85, Math.min(canvas.height - 25, player.y + knockY));
                addPopup(player.x, player.y - 26, `-${amount} HP`, '#ff4d4d');
                spawnParticles(player.x, player.y - 10, '#ff3b3b', 14, 1.2);
            }

            if (player.hp <= 0) {
                game.state = 'GAME_OVER';
                game.loseReason = reason;
            }
        }

        // POWER 1: BIG BEAM (Spacebar — 75% of hit enemies' health, 1 time per round)
        function fireBigBeam() {
            if (player.bigBeamCharges <= 0) return;
            player.bigBeamCharges--;
            player.shootCooldown = 18;

            let angle = player.facing === 1 ? 0 : Math.PI;
            if (mouse.active) {
                angle = Math.atan2(mouse.y - (player.y - 10), mouse.x - player.x);
                player.facing = Math.cos(angle) >= 0 ? 1 : -1;
            }

            const startX = player.x + Math.cos(angle) * 14;
            const startY = player.y - 10 + Math.sin(angle) * 14;
            const beamLen = Math.max(canvas.width, canvas.height) * 1.25;
            const endX = startX + Math.cos(angle) * beamLen;
            const endY = startY + Math.sin(angle) * beamLen;

            game.beams.push({
                x1: startX,
                y1: startY,
                x2: endX,
                y2: endY,
                life: 24,
                maxLife: 24
            });

            game.shakeTimer = 16;
            game.shakeIntensity = 7;
            addPopup(player.x, player.y - 36, 'BIG BEAM!! (75% DMG)', '#38f2ff');

            // Check line-circle intersection against all enemies
            for (let j = game.enemies.length - 1; j >= 0; j--) {
                const en = game.enemies[j];
                const dLine = pointToSegmentDist(en.x, en.y, startX, startY, endX, endY);
                if (dLine <= en.radius + 26) {
                    const dmg = Math.max(1, Math.ceil(en.maxHp * 0.75));
                    damageEnemy(j, dmg, '#38f2ff', 'BIG BEAM -75%!');
                }
            }
        }

        // POWER 2: FOR SCIENCE (Key E — wins the round, only once per game)
        function activateForScience() {
            if (player.forScienceUsed) {
                addPopup(player.x, player.y - 30, 'FOR SCIENCE ALREADY USED!', '#ffae00');
                return;
            }
            player.forScienceUsed = true;
            game.shakeTimer = 24;
            game.shakeIntensity = 10;

            game.scienceWaves.push({
                x: player.x,
                y: player.y - 10,
                radius: 15,
                maxRadius: Math.max(canvas.width, canvas.height) * 1.1,
                life: 40,
                maxLife: 40
            });

            // Capture all remaining enemies & award +10 coins each!
            const remaining = game.enemies.length;
            for (const en of game.enemies) {
                player.coins += 10;
                game.capturedAliens++;
                spawnParticles(en.x, en.y, '#4dff88', 18, 1.6);
            }
            game.enemies = [];
            game.enemyProjectiles = [];
            game.ship.unlocked = true;

            addPopup(player.x, player.y - 38, `FOR SCIENCE!! (+${remaining * 10} COINS)`, '#4dff88');
            spawnParticles(game.ship.x, game.ship.y, '#ffd700', 40, 2.0);

            if (game.level >= game.maxLevels) {
                game.state = 'VICTORY';
            } else {
                game.state = 'LEVEL_CLEAR';
            }
        }

        // POWER 3: PHASE (Key Q — Dash through enemies, invulnerable while phasing, 5s cooldown)
        function activatePhase() {
            if (player.phaseCooldown > 0 || player.phaseActiveTimer > 0) {
                addPopup(player.x, player.y - 28, `PHASE: ${player.phaseCooldown.toFixed(1)}s`, '#66f7ff');
                return;
            }

            let dx = 0;
            let dy = 0;
            if (keys['KeyW'] || keys['Keyw']) dy -= 1;
            if (keys['KeyS'] || keys['Keys']) dy += 1;
            if (keys['KeyA'] || keys['Keya']) dx -= 1;
            if (keys['KeyD'] || keys['Keyd']) dx += 1;

            if (dx === 0 && dy === 0) {
                dx = player.facing;
            } else {
                const len = Math.hypot(dx, dy);
                dx /= len;
                dy /= len;
            }

            player.phaseDirX = dx;
            player.phaseDirY = dy;
            player.phaseActiveTimer = 22; // ~0.37 seconds of rapid invulnerable phase dash
            player.phaseCooldown = player.phaseMaxCooldown;
            player.phaseTrail = [];

            addPopup(player.x, player.y - 28, 'PHASE DASH!', '#38f2ff');
            spawnParticles(player.x, player.y - 10, '#38f2ff', 16, 1.3);
        }

        function pointToSegmentDist(px, py, x1, y1, x2, y2) {
            const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
            if (l2 === 0) return dist(px, py, x1, y1);
            let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
            t = Math.max(0, Math.min(1, t));
            return dist(px, py, x1 + t * (x2 - x1), y1 + t * (y2 - y1));
        }

        function fireCaptureOrb(useMouse) {
            if (player.shootCooldown > 0) return;
            player.shootCooldown = 13;

            let angle = player.facing === 1 ? 0 : Math.PI;
            if (useMouse && mouse.active) {
                angle = Math.atan2(mouse.y - (player.y - 10), mouse.x - player.x);
                player.facing = Math.cos(angle) >= 0 ? 1 : -1;
            } else {
                // Smart-assist toward nearest enemy in facing direction
                let bestDist = 360;
                for (const enemy of game.enemies) {
                    const dx = enemy.x - player.x;
                    const dy = enemy.y - (player.y - 10);
                    const d = Math.hypot(dx, dy);
                    if (d < bestDist && Math.sign(dx || player.facing) === player.facing) {
                        bestDist = d;
                        angle = Math.atan2(dy, dx);
                    }
                }
            }

            player.aimAngle = angle;
            const speed = 9.5;
            game.projectiles.push({
                x: player.x + Math.cos(angle) * 14,
                y: player.y - 10 + Math.sin(angle) * 14,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                radius: player.orbDamage > 1 ? 7.5 : 6,
                damage: player.orbDamage,
                life: 68
            });
            spawnParticles(player.x + Math.cos(angle) * 12, player.y - 10, '#38f2ff', 5, 0.7);
        }

        function damageEnemy(index, dmg, color, label) {
            const en = game.enemies[index];
            if (!en) return;
            en.hp -= dmg;
            en.hitFlash = 8;
            spawnParticles(en.x, en.y, color, 10, 1.1);

            if (en.hp <= 0) {
                game.capturedAliens++;
                player.coins += 10; // +10 Coins per defeated alien!
                addPopup(en.x, en.y - 22, `${en.name.toUpperCase()} CAPTURED! +10 COINS`, '#ffd700');
                spawnParticles(en.x, en.y, '#ffd700', 22, 1.6);
                game.enemies.splice(index, 1);

                if (game.enemies.length === 0) {
                    game.ship.unlocked = true;
                    showBanner('ALL ALIENS CAPTURED! BOARD THE ALIEN SHIP FOR THE CROWN!', 220);
                    spawnParticles(game.ship.x, game.ship.y, '#ffd700', 32, 1.8);
                }
            } else {
                addPopup(en.x, en.y - 20, `${label} (${en.hp}/${en.maxHp})`, color);
            }
        }

        function resolveCircleObstacle(entity, radius, bounceVel) {
            for (const rock of game.rocks) {
                const dx = entity.x - rock.x;
                const dy = entity.y - rock.y;
                const d = Math.hypot(dx, dy);
                const minDist = radius + rock.r;
                if (d < minDist && d > 0.001) {
                    const overlap = minDist - d;
                    entity.x += (dx / d) * overlap;
                    entity.y += (dy / d) * overlap;
                    if (bounceVel && entity.vx !== undefined) {
                        const nx = dx / d;
                        const ny = dy / d;
                        const dot = entity.vx * nx + entity.vy * ny;
                        if (dot < 0) {
                            entity.vx -= 2 * dot * nx;
                            entity.vy -= 2 * dot * ny;
                        }
                    }
                }
            }
        }

        function updatePhysics(dt) {
            game.frame++;
            if (game.bannerTimer > 0) game.bannerTimer--;
            if (game.shakeTimer > 0) game.shakeTimer--;
            if (player.invulnTimer > 0) player.invulnTimer--;
            if (player.shootCooldown > 0) player.shootCooldown--;
            if (player.phaseCooldown > 0) {
                player.phaseCooldown = Math.max(0, player.phaseCooldown - dt);
            }

            if (game.state !== 'PLAYING' || game.shopOpen) {
                updateVisualEffects();
                return;
            }

            const theme = getPlanetTheme(game.level);

            // 0. ENEMY RUSH 30-SECOND TIMER (Every 5 levels: Level 5 & Level 10)
            if (theme.isRush) {
                game.rushTimeLeft = Math.max(0, game.rushTimeLeft - dt);
                if (game.rushTimeLeft <= 0 && game.enemies.length > 0) {
                    player.hp = 0;
                    game.state = 'GAME_OVER';
                    game.loseReason = 'Time ran out during the 30-second Enemy Rush!';
                    return;
                }
            }

            // 0B. SPACE BUGS (The more time you spend in space, the more damage you take!)
            game.roundSeconds += dt;
            game.bugTickAccum += dt;
            if (game.bugTickAccum >= 3.0) {
                game.bugTickAccum = 0;
                // Escalates every 12 seconds spent in space
                const bugTier = Math.floor(game.roundSeconds / 12);
                if (bugTier >= 1) {
                    const bugDmg = Math.max(1, Math.round(bugTier * 1.5 * player.bugResistance));
                    damagePlayer(bugDmg, 'Overwhelmed by Space Bugs from staying in space too long!', 0, 0, true);
                    addPopup(player.x, player.y - 34, `SPACE BUGS -${bugDmg} HP`, '#c084fc');
                    spawnParticles(player.x, player.y - 12, '#a855f7', 6, 0.8);
                    if (game.state === 'GAME_OVER') return;
                }
            }

            // 1. ASTRONAUT MOVEMENT & PHASE DASH
            if (player.phaseActiveTimer > 0) {
                player.phaseActiveTimer--;
                player.phaseTrail.push({ x: player.x, y: player.y, alpha: 0.75 });
                if (player.phaseTrail.length > 8) player.phaseTrail.shift();

                player.x += player.phaseDirX * 13.5;
                player.y += player.phaseDirY * 13.5;
                player.x = Math.max(22, Math.min(canvas.width - 22, player.x));
                player.y = Math.max(85, Math.min(canvas.height - 22, player.y));
                // Note: While phasing, Stickman passes right through enemies & rocks invulnerably!
            } else {
                if (player.phaseTrail.length > 0) player.phaseTrail.shift();

                let dx = 0;
                let dy = 0;
                if (keys['KeyW'] || keys['Keyw']) dy -= 1;
                if (keys['KeyS'] || keys['Keys']) dy += 1;
                if (keys['KeyA'] || keys['Keya']) { dx -= 1; player.facing = -1; }
                if (keys['KeyD'] || keys['Keyd']) { dx += 1; player.facing = 1; }

                if (dx !== 0 && dy !== 0) {
                    dx *= 0.7071;
                    dy *= 0.7071;
                }

                player.x += dx * player.speed;
                player.y += dy * player.speed;

                player.x = Math.max(22, Math.min(canvas.width - 22, player.x));
                player.y = Math.max(85, Math.min(canvas.height - 22, player.y));

                resolveCircleObstacle(player, 12, false);

                if (dx !== 0 || dy !== 0) {
                    player.walkFrame += 0.25;
                } else {
                    player.walkFrame = 0;
                }
            }

            // 2. CRATERS & RISING LAVA ERUPTIONS
            const lavaDamage = 8 + Math.floor(game.level * 1.2);
            for (const crater of game.craters) {
                crater.timer--;
                if (crater.state === 'DORMANT' && crater.timer <= 0) {
                    crater.state = 'STEAMING';
                    crater.timer = Math.max(40, Math.floor(70 / theme.lavaSpeedMult));
                } else if (crater.state === 'STEAMING') {
                    if (game.frame % 4 === 0) {
                        game.particles.push({
                            x: crater.x + (Math.random() - 0.5) * crater.r,
                            y: crater.y + (Math.random() - 0.5) * crater.r * 0.5,
                            vx: (Math.random() - 0.5) * 0.6,
                            vy: -1.4 - Math.random() * 1.1,
                            size: 4 + Math.random() * 4,
                            color: 'rgba(230, 235, 245, 0.5)',
                            life: 30,
                            maxLife: 30
                        });
                    }
                    if (crater.timer <= 0) {
                        crater.state = 'LAVA';
                        crater.lavaRise = 0;
                        crater.timer = 185;
                        spawnParticles(crater.x, crater.y, '#ff6a00', 12, 1.3);
                    }
                } else if (crater.state === 'LAVA') {
                    crater.lavaRise = Math.min(1, crater.lavaRise + 0.05);
                    if (game.frame % 3 === 0) {
                        game.particles.push({
                            x: crater.x + (Math.random() - 0.5) * crater.r * 1.2,
                            y: crater.y - crater.lavaRise * 12,
                            vx: (Math.random() - 0.5) * 0.8,
                            vy: -1.8 - Math.random() * 1.4,
                            size: 3.5 + Math.random() * 4,
                            color: Math.random() < 0.5 ? '#ffae00' : '#ff4500',
                            life: 28,
                            maxLife: 28
                        });
                    }

                    const dLava = dist(player.x, player.y - 4, crater.x, crater.y);
                    if (dLava < crater.r * 0.88 + 8) {
                        const pushAng = Math.atan2(player.y - crater.y, player.x - crater.x);
                        damagePlayer(
                            lavaDamage,
                            'Burned by rising lava erupting from a crater!',
                            Math.cos(pushAng) * 18,
                            Math.sin(pushAng) * 18
                        );
                    }

                    if (crater.timer <= 0) {
                        crater.state = 'DORMANT';
                        crater.lavaRise = 0;
                        crater.timer = Math.floor((160 + Math.random() * 210) / theme.lavaSpeedMult);
                    }
                }
            }

            // 3. PLAYER CAPTURE ORB PROJECTILES
            for (let i = game.projectiles.length - 1; i >= 0; i--) {
                const p = game.projectiles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;

                if (game.frame % 2 === 0) {
                    game.particles.push({
                        x: p.x,
                        y: p.y,
                        vx: (Math.random() - 0.5) * 0.8,
                        vy: (Math.random() - 0.5) * 0.8,
                        size: 2.5,
                        color: p.damage > 1 ? '#ffd700' : '#66f7ff',
                        life: 12,
                        maxLife: 12
                    });
                }

                if (game.rocks.some(rk => dist(p.x, p.y, rk.x, rk.y) < rk.r + p.radius)) {
                    spawnParticles(p.x, p.y, '#38f2ff', 6, 0.8);
                    game.projectiles.splice(i, 1);
                    continue;
                }

                let hitEnemy = false;
                for (let j = game.enemies.length - 1; j >= 0; j--) {
                    const en = game.enemies[j];
                    if (dist(p.x, p.y, en.x, en.y) < en.radius + p.radius + 4) {
                        hitEnemy = true;
                        damageEnemy(j, p.damage, '#38f2ff', 'ZAP!');
                        break;
                    }
                }

                if (hitEnemy || p.life <= 0 || p.x < 0 || p.x > canvas.width || p.y < 68 || p.y > canvas.height) {
                    game.projectiles.splice(i, 1);
                }
            }

            // 4. ENEMY PROJECTILES (dicer dice shots & X 2 hand energy orbs)
            for (let i = game.enemyProjectiles.length - 1; i >= 0; i--) {
                const ep = game.enemyProjectiles[i];
                ep.x += ep.vx;
                ep.y += ep.vy;
                ep.life--;

                if (game.rocks.some(rk => dist(ep.x, ep.y, rk.x, rk.y) < rk.r + ep.radius)) {
                    spawnParticles(ep.x, ep.y, ep.color, 5, 0.7);
                    game.enemyProjectiles.splice(i, 1);
                    continue;
                }

                if (dist(ep.x, ep.y, player.x, player.y - 10) < ep.radius + 10) {
                    const pushAng = Math.atan2(ep.vy, ep.vx);
                    damagePlayer(
                        ep.damage,
                        ep.reason,
                        Math.cos(pushAng) * 12,
                        Math.sin(pushAng) * 12
                    );
                    spawnParticles(ep.x, ep.y, ep.color, 8, 1.0);
                    game.enemyProjectiles.splice(i, 1);
                    continue;
                }

                if (ep.life <= 0 || ep.x < 0 || ep.x > canvas.width || ep.y < 68 || ep.y > canvas.height) {
                    game.enemyProjectiles.splice(i, 1);
                }
            }

            // 5. UPDATE ENEMIES (dicer, X 2, mini x, Chocolate, Jon)
            for (const en of game.enemies) {
                if (en.hitFlash > 0) en.hitFlash--;
                const dPlayer = dist(en.x, en.y, player.x, player.y - 8);
                const angToPlayer = Math.atan2((player.y - 8) - en.y, player.x - en.x);

                if (en.type === 'dicer') {
                    // Stationary trap / turret: every time dicer shoots, he turns himself!
                    if (en.spinTimer > 0) {
                        en.spinTimer--;
                        en.spinAngle += 0.45;
                    } else {
                        en.spinAngle = 0;
                    }

                    en.shootTimer--;
                    if (en.shootTimer <= 0) {
                        en.shootTimer = Math.max(70, 135 - game.level * 5);
                        en.spinTimer = 18;
                        en.faceValue = Math.floor(Math.random() * 6) + 1; // Turns to new face 1-6!

                        const shotSpeed = 4.6;
                        game.enemyProjectiles.push({
                            x: en.x + Math.cos(angToPlayer) * 18,
                            y: en.y + Math.sin(angToPlayer) * 18,
                            vx: Math.cos(angToPlayer) * shotSpeed,
                            vy: Math.sin(angToPlayer) * shotSpeed,
                            radius: 6,
                            damage: en.faceValue, // 1-6 damage
                            color: '#ffffff',
                            kind: 'dice_pip',
                            pip: en.faceValue,
                            reason: `Hit by dicer's ${en.faceValue}-roll shot!`,
                            life: 135
                        });
                    }

                    // Touch: does 1-6 damage
                    if (dPlayer < en.radius + 11) {
                        const dmg = Math.floor(Math.random() * 6) + 1;
                        damagePlayer(
                            dmg,
                            'Rolled over by dicer!',
                            Math.cos(angToPlayer) * 16,
                            Math.sin(angToPlayer) * 16
                        );
                    }
                } else if (en.type === 'x2') {
                    // X 2: Float or bounce up and down at Fast (Tricky!) speed
                    en.floatPhase += 0.12;
                    en.x += en.vx;
                    en.baseY += en.vy;

                    if (en.x < 65) { en.x = 65; en.vx = Math.abs(en.vx); }
                    if (en.x > canvas.width - 65) { en.x = canvas.width - 65; en.vx = -Math.abs(en.vx); }
                    if (en.baseY < 135) { en.baseY = 135; en.vy = Math.abs(en.vy); }
                    if (en.baseY > canvas.height - 75) { en.baseY = canvas.height - 75; en.vy = -Math.abs(en.vy); }

                    en.y = en.baseY + Math.sin(en.floatPhase) * 32;

                    // 4 hands shoot energy orbs
                    en.orbShootTimer--;
                    if (en.orbShootTimer <= 0) {
                        en.orbShootTimer = Math.max(65, 115 - game.level * 4);
                        const spread = [-0.22, 0.22];
                        for (const offset of spread) {
                            const a = angToPlayer + offset;
                            game.enemyProjectiles.push({
                                x: en.x + Math.cos(a) * 26,
                                y: en.y + Math.sin(a) * 26,
                                vx: Math.cos(a) * 5.2,
                                vy: Math.sin(a) * 5.2,
                                radius: 6.5,
                                damage: 8,
                                color: '#ff1e56',
                                kind: 'x2_orb',
                                reason: 'Blasted by X 2\'s energy orbs!',
                                life: 120
                            });
                        }
                    }

                    // Spawns mini x's!
                    en.spawnMiniTimer--;
                    if (en.spawnMiniTimer <= 0) {
                        en.spawnMiniTimer = 250;
                        const activeMinis = game.enemies.filter(e => e.type === 'mini_x').length;
                        if (activeMinis < 4) {
                            const mx = Math.max(60, Math.min(canvas.width - 60, en.x + (Math.random() * 60 - 30)));
                            const my = Math.max(100, Math.min(canvas.height - 60, en.y + 24));
                            game.enemies.push(createEnemy('mini_x', mx, my, game.enemies.length));
                            game.totalAliens++;
                            addPopup(en.x, en.y - 34, 'SPAWNED MINI X!', '#ff4d79');
                            spawnParticles(mx, my, '#ff1e56', 12, 1.1);
                        }
                    }

                    // Touch: take 99% of your health on 1st hit and on 2nd hit instant defeat!
                    if (dPlayer < en.radius + 12 && player.invulnTimer <= 0 && player.phaseActiveTimer <= 0) {
                        player.x2HitCount++;
                        if (player.x2HitCount === 1) {
                            const ninetyNinePct = Math.max(1, Math.floor(player.hp * 0.99));
                            player.hp = Math.max(1, player.hp - ninetyNinePct);
                            player.invulnTimer = 75;
                            game.shakeTimer = 22;
                            game.shakeIntensity = 11;
                            player.x = Math.max(25, Math.min(canvas.width - 25, player.x + Math.cos(angToPlayer) * 32));
                            player.y = Math.max(85, Math.min(canvas.height - 25, player.y + Math.sin(angToPlayer) * 32));
                            addPopup(player.x, player.y - 32, `X 2 HIT #1: -99% HP! (${player.hp} HP LEFT)`, '#ff1e56');
                            spawnParticles(player.x, player.y - 10, '#ff1e56', 28, 1.8);
                        } else {
                            player.hp = 0;
                            game.shakeTimer = 26;
                            game.shakeIntensity = 13;
                            addPopup(player.x, player.y - 32, 'X 2 HIT #2: INSTANT DEFEAT!', '#ff1e56');
                            spawnParticles(player.x, player.y - 10, '#ff1e56', 36, 2.1);
                            game.state = 'GAME_OVER';
                            game.loseReason = '2nd touch from X 2 — Instant Defeat!';
                        }
                    }
                } else if (en.type === 'mini_x') {
                    // Mini X spawned by X 2
                    en.bouncePhase += 0.2;
                    en.x += Math.cos(angToPlayer) * en.speed;
                    en.y += Math.sin(angToPlayer) * en.speed + Math.sin(en.bouncePhase) * 1.4;
                    resolveCircleObstacle(en, en.radius, false);

                    if (dPlayer < en.radius + 10) {
                        damagePlayer(
                            5,
                            'Swarmed by a mini x!',
                            Math.cos(angToPlayer) * 14,
                            Math.sin(angToPlayer) * 14
                        );
                    }
                } else if (en.type === 'chocolate') {
                    // Chocolate bar with alien eyes: Patrol back and forth (Left / Right) at Fast speed, 10 HP damage
                    en.wobble += 0.22;
                    en.x += en.vx;

                    if (en.x < 42) { en.x = 42; en.vx = Math.abs(en.vx); }
                    if (en.x > canvas.width - 42) { en.x = canvas.width - 42; en.vx = -Math.abs(en.vx); }

                    // Reverse patrol direction if hitting a boulder
                    for (const rk of game.rocks) {
                        if (dist(en.x, en.y, rk.x, rk.y) < en.radius + rk.r + 2) {
                            en.vx = -en.vx;
                            en.x += en.vx * 2;
                            break;
                        }
                    }

                    if (dPlayer < en.radius + 11) {
                        damagePlayer(
                            10,
                            'Slammed by Chocolate!',
                            Math.cos(angToPlayer) * 18,
                            Math.sin(angToPlayer) * 18
                        );
                    }
                } else if (en.type === 'Jon') {
                    // Jon: green, one eye, short, Chase Stickman when nearby, Medium pace, lose 5 HP
                    en.hopPhase += 0.18;
                    const chaseRange = 340;
                    if (dPlayer < chaseRange) {
                        en.vx = Math.cos(angToPlayer) * en.speed;
                        en.vy = Math.sin(angToPlayer) * en.speed;
                    } else {
                        en.wanderAngle += (Math.random() - 0.5) * 0.09;
                        en.vx = Math.cos(en.wanderAngle) * (en.speed * 0.55);
                        en.vy = Math.sin(en.wanderAngle) * (en.speed * 0.55);
                    }

                    en.x += en.vx;
                    en.y += en.vy;
                    resolveCircleObstacle(en, en.radius, false);

                    if (en.x < 35) { en.x = 35; en.wanderAngle = 0; }
                    if (en.x > canvas.width - 35) { en.x = canvas.width - 35; en.wanderAngle = Math.PI; }
                    if (en.y < 95) { en.y = 95; en.wanderAngle = Math.PI / 2; }
                    if (en.y > canvas.height - 35) { en.y = canvas.height - 35; en.wanderAngle = -Math.PI / 2; }

                    if (dPlayer < en.radius + 11) {
                        damagePlayer(
                            5,
                            'Caught by Jon!',
                            Math.cos(angToPlayer) * 15,
                            Math.sin(angToPlayer) * 15
                        );
                    }
                }
            }

            // 6. CHECK ALIEN SHIP & ALIEN CROWN GOAL
            if (game.ship.unlocked) {
                const dShip = dist(player.x, player.y - 8, game.ship.x, game.ship.y);
                if (dShip < game.ship.radius + 12) {
                    spawnParticles(game.ship.x, game.ship.y, '#ffd700', 42, 2.0);
                    if (game.level >= game.maxLevels) {
                        game.state = 'VICTORY';
                    } else {
                        game.state = 'LEVEL_CLEAR';
                    }
                }
            }

            updateVisualEffects();
        }

        function updateVisualEffects() {
            for (let i = game.particles.length - 1; i >= 0; i--) {
                const pt = game.particles[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.life--;
                if (pt.life <= 0) game.particles.splice(i, 1);
            }

            for (let i = game.popups.length - 1; i >= 0; i--) {
                const pop = game.popups[i];
                pop.y -= 0.72;
                pop.life--;
                if (pop.life <= 0) game.popups.splice(i, 1);
            }

            for (let i = game.beams.length - 1; i >= 0; i--) {
                game.beams[i].life--;
                if (game.beams[i].life <= 0) game.beams.splice(i, 1);
            }

            for (let i = game.scienceWaves.length - 1; i >= 0; i--) {
                const sw = game.scienceWaves[i];
                sw.radius += (sw.maxRadius - sw.radius) * 0.14;
                sw.life--;
                if (sw.life <= 0) game.scienceWaves.splice(i, 1);
            }
        }

        // ==================== RENDERING ====================

        function drawSpaceAndPlanetBackground() {
            const theme = getPlanetTheme(game.level);

            // Infinite Space Gradient
            const spaceGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            spaceGrad.addColorStop(0, theme.spaceTop);
            spaceGrad.addColorStop(1, theme.spaceBottom);
            ctx.fillStyle = spaceGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Twinkling Stars
            for (const s of game.stars) {
                const alpha = 0.35 + 0.65 * Math.abs(Math.sin(game.frame * s.twinkleSpeed + s.phase));
                ctx.globalAlpha = alpha;
                ctx.fillStyle = s.color;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Distant Ringed Planet in Infinite Space
            const dpX = canvas.width * 0.24;
            const dpY = 108;
            ctx.save();
            ctx.globalAlpha = 0.32;
            ctx.fillStyle = theme.distantPlanetColor;
            ctx.beginPath();
            ctx.arc(dpX, dpY, 26, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(dpX, dpY, 44, 10, -0.25, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            // Planet Horizon & Ground
            const horizonY = 78;
            ctx.fillStyle = theme.groundFill;
            ctx.beginPath();
            ctx.moveTo(0, horizonY + 12);
            ctx.quadraticCurveTo(canvas.width * 0.5, horizonY - 10, canvas.width, horizonY + 12);
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = theme.groundRim;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(0, horizonY + 12);
            ctx.quadraticCurveTo(canvas.width * 0.5, horizonY - 10, canvas.width, horizonY + 12);
            ctx.stroke();

            // Planet-Specific Scenery Props (Diamonds on Level 3, Shiny Gold on Level 4, etc.)
            for (const prop of game.sceneryProps) {
                const shimmer = 0.65 + 0.35 * Math.sin(game.frame * 0.08 + prop.shimmerPhase);
                ctx.save();
                ctx.translate(prop.x, prop.y);
                ctx.globalAlpha = shimmer;

                if (prop.kind === 'diamond') {
                    // Sparkling Cut Diamond
                    ctx.fillStyle = '#4ce8ff';
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.moveTo(0, -prop.size);
                    ctx.lineTo(prop.size * 0.85, 0);
                    ctx.lineTo(0, prop.size);
                    ctx.lineTo(-prop.size * 0.85, 0);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                } else if (prop.kind === 'gold') {
                    // Shiny Gold Nugget & Gleam
                    ctx.fillStyle = '#ffd700';
                    ctx.strokeStyle = '#fff8b8';
                    ctx.lineWidth = 1.3;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, prop.size * 1.1, prop.size * 0.7, 0.3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    // Star sparkle
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(-1, -prop.size * 0.9, 2, prop.size * 1.8);
                    ctx.fillRect(-prop.size * 0.9, -1, prop.size * 1.8, 2);
                } else if (prop.kind === 'emerald') {
                    ctx.fillStyle = '#10b981';
                    ctx.strokeStyle = '#a7f3d0';
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.moveTo(0, -prop.size);
                    ctx.lineTo(prop.size * 0.7, -prop.size * 0.3);
                    ctx.lineTo(prop.size * 0.7, prop.size * 0.6);
                    ctx.lineTo(0, prop.size);
                    ctx.lineTo(-prop.size * 0.7, prop.size * 0.6);
                    ctx.lineTo(-prop.size * 0.7, -prop.size * 0.3);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                } else if (prop.kind === 'crystal_purple') {
                    ctx.fillStyle = '#a855f7';
                    ctx.beginPath();
                    ctx.moveTo(0, -prop.size * 1.2);
                    ctx.lineTo(prop.size * 0.5, prop.size * 0.6);
                    ctx.lineTo(-prop.size * 0.5, prop.size * 0.6);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    ctx.fillStyle = theme.rockHighlight;
                    ctx.beginPath();
                    ctx.arc(0, 0, prop.size * 0.35, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            // Rocky Craters & Rising Lava
            for (const crater of game.craters) {
                ctx.fillStyle = theme.craterRim;
                ctx.beginPath();
                ctx.ellipse(crater.x, crater.y, crater.r + 4, (crater.r + 4) * 0.68, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = theme.craterDark;
                ctx.beginPath();
                ctx.ellipse(crater.x, crater.y + 1, crater.r - 2, (crater.r - 2) * 0.64, 0, 0, Math.PI * 2);
                ctx.fill();

                if (crater.state === 'STEAMING') {
                    const pulse = 0.5 + 0.5 * Math.sin(game.frame * 0.35);
                    ctx.fillStyle = `rgba(255, 95, 0, ${0.35 + pulse * 0.45})`;
                    ctx.beginPath();
                    ctx.ellipse(crater.x, crater.y + 1, crater.r * 0.72, crater.r * 0.46, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else if (crater.state === 'LAVA') {
                    const riseScale = 0.85 + crater.lavaRise * 0.35;
                    const glow = ctx.createRadialGradient(crater.x, crater.y, 4, crater.x, crater.y, crater.r * riseScale);
                    glow.addColorStop(0, '#fff380');
                    glow.addColorStop(0.45, '#ff5500');
                    glow.addColorStop(0.85, 'rgba(210, 20, 0, 0.72)');
                    glow.addColorStop(1, 'rgba(255, 60, 0, 0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.ellipse(crater.x, crater.y - crater.lavaRise * 4, crater.r * riseScale, crater.r * 0.82 * riseScale, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Rocky Boulders (with embedded diamonds/gold on special planets!)
            for (const rock of game.rocks) {
                ctx.fillStyle = theme.rockColor;
                ctx.strokeStyle = theme.rockHighlight;
                ctx.lineWidth = 2;
                ctx.beginPath();
                const sides = 7;
                for (let i = 0; i < sides; i++) {
                    const a = (i / sides) * Math.PI * 2;
                    const rad = rock.r * (0.88 + 0.14 * Math.sin(rock.seed + i * 2.3));
                    const rx = rock.x + Math.cos(a) * rad;
                    const ry = rock.y + Math.sin(a) * rad;
                    if (i === 0) ctx.moveTo(rx, ry);
                    else ctx.lineTo(rx, ry);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                if (theme.sceneryType === 'diamonds' || theme.sceneryType === 'diamond_gold') {
                    ctx.fillStyle = '#7ef9ff';
                    ctx.beginPath();
                    ctx.moveTo(rock.x, rock.y - 6);
                    ctx.lineTo(rock.x + 5, rock.y);
                    ctx.lineTo(rock.x, rock.y + 6);
                    ctx.lineTo(rock.x - 5, rock.y);
                    ctx.closePath();
                    ctx.fill();
                } else if (theme.sceneryType === 'gold') {
                    ctx.fillStyle = '#ffd700';
                    ctx.beginPath();
                    ctx.arc(rock.x + 3, rock.y - 2, 4.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Subtle buzzing Space Bugs around screen borders as round time grows
            const bugVisualCount = Math.min(28, Math.floor(game.roundSeconds / 2));
            if (bugVisualCount > 0) {
                ctx.fillStyle = '#c084fc';
                for (let b = 0; b < bugVisualCount; b++) {
                    const angle = (b / bugVisualCount) * Math.PI * 2 + game.frame * 0.02;
                    const inward = Math.min(180, game.roundSeconds * 1.8);
                    const bx = canvas.width / 2 + Math.cos(angle) * (canvas.width * 0.48 - inward);
                    const by = canvas.height / 2 + Math.sin(angle) * (canvas.height * 0.44 - inward * 0.6);
                    ctx.beginPath();
                    ctx.arc(bx, by, 2.2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function drawAlienShipAndCrown() {
            const { x, y, unlocked } = game.ship;
            const bob = Math.sin(game.frame * 0.06) * 4;

            ctx.save();
            ctx.translate(x, y + bob);

            ctx.strokeStyle = unlocked ? '#ffd700' : 'rgba(140, 160, 200, 0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(0, 24, 46, 14, 0, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#5c6b8a';
            ctx.strokeStyle = '#c5d5f5';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(0, 6, 40, 14, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            for (let i = -2; i <= 2; i++) {
                ctx.fillStyle = unlocked ? '#ffd700' : '#ff4d4d';
                ctx.beginPath();
                ctx.arc(i * 13, 7, 2.6, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = unlocked ? 'rgba(255, 225, 90, 0.28)' : 'rgba(100, 200, 255, 0.2)';
            ctx.strokeStyle = unlocked ? '#ffd700' : '#7cc8ff';
            ctx.beginPath();
            ctx.arc(0, -2, 22, Math.PI, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // THE ALIEN CROWN
            ctx.fillStyle = '#ffd700';
            ctx.strokeStyle = '#fff5a8';
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(-10, -3);
            ctx.lineTo(-12, -14);
            ctx.lineTo(-5, -8);
            ctx.lineTo(0, -17);
            ctx.lineTo(5, -8);
            ctx.lineTo(12, -14);
            ctx.lineTo(10, -3);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.font = 'bold 11px Courier New';
            ctx.textAlign = 'center';
            if (unlocked) {
                ctx.fillStyle = '#ffd700';
                ctx.fillText('★ CLAIM ALIEN CROWN! ★', 0, -30);
            } else {
                ctx.fillStyle = '#9aa8c7';
                ctx.fillText('SHIP LOCKED', 0, -30);
            }

            ctx.restore();
        }

        function drawDicePips(val, size) {
            ctx.fillStyle = '#111118';
            const off = size * 0.48;
            const r = 2.4;
            const spots = {
                1: [[0, 0]],
                2: [[-off, -off], [off, off]],
                3: [[-off, -off], [0, 0], [off, off]],
                4: [[-off, -off], [off, -off], [-off, off], [off, off]],
                5: [[-off, -off], [off, -off], [0, 0], [-off, off], [off, off]],
                6: [[-off, -off], [off, -off], [-off, 0], [off, 0], [-off, off], [off, off]]
            };
            for (const [px, py] of (spots[val] || spots[1])) {
                ctx.beginPath();
                ctx.arc(px, py, r, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawEnemies() {
            for (const en of game.enemies) {
                ctx.save();
                ctx.translate(en.x, en.y);

                // FEATURE REQUEST: Highlight every enemy in RED while alive!
                const pulse = 0.65 + 0.35 * Math.sin(game.frame * 0.16);
                const hlRadius = en.radius + 9;
                ctx.save();
                ctx.strokeStyle = `rgba(255, 36, 56, ${pulse})`;
                ctx.fillStyle = 'rgba(255, 25, 45, 0.14)';
                ctx.lineWidth = 2.2;
                ctx.beginPath();
                ctx.arc(0, 0, hlRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Red corner target brackets around each live enemy
                const b = hlRadius + 2;
                const c = 5;
                ctx.strokeStyle = '#ff2438';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-b, -b + c); ctx.lineTo(-b, -b); ctx.lineTo(-b + c, -b);
                ctx.moveTo(b - c, -b); ctx.lineTo(b, -b); ctx.lineTo(b, -b + c);
                ctx.moveTo(-b, b - c); ctx.lineTo(-b, b); ctx.lineTo(-b + c, b);
                ctx.moveTo(b - c, b); ctx.lineTo(b, b); ctx.lineTo(b, b - c);
                ctx.stroke();
                ctx.restore();

                if (en.type === 'dicer') {
                    // Looks like a dice, turns himself every time he shoots!
                    ctx.save();
                    ctx.rotate(en.spinAngle);
                    const s = 17;
                    ctx.fillStyle = en.hitFlash > 0 ? '#ffd6d6' : '#f8fafc';
                    ctx.strokeStyle = '#ff2438';
                    ctx.lineWidth = 2.2;
                    ctx.beginPath();
                    ctx.roundRect(-s, -s, s * 2, s * 2, 5);
                    ctx.fill();
                    ctx.stroke();
                    drawDicePips(en.faceValue, s);
                    ctx.restore();
                } else if (en.type === 'x2') {
                    // X 2: Red triangle head with a cloak and 4 hands that shoot energy orbs!
                    const handWave = Math.sin(game.frame * 0.15) * 5;

                    // Dark Cloak
                    ctx.fillStyle = en.hitFlash > 0 ? '#7f1d1d' : '#180c1c';
                    ctx.strokeStyle = '#ff1e56';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-14, -2);
                    ctx.lineTo(14, -2);
                    ctx.lineTo(25, 28);
                    ctx.lineTo(9, 22);
                    ctx.lineTo(0, 30);
                    ctx.lineTo(-9, 22);
                    ctx.lineTo(-25, 28);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    // 4 Floating Hands (2 upper, 2 lower)
                    const hands = [
                        { hx: -28, hy: -4 + handWave },
                        { hx: 28, hy: -4 - handWave },
                        { hx: -32, hy: 13 - handWave },
                        { hx: 32, hy: 13 + handWave }
                    ];
                    for (const h of hands) {
                        ctx.fillStyle = '#ffe4e6';
                        ctx.strokeStyle = '#ff1e56';
                        ctx.lineWidth = 1.8;
                        ctx.beginPath();
                        ctx.arc(h.hx, h.hy, 5.2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();

                        // Energy orb glow in hand
                        ctx.fillStyle = '#ff1e56';
                        ctx.beginPath();
                        ctx.arc(h.hx, h.hy, 2.2, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // RED Triangle Head
                    ctx.fillStyle = en.hitFlash > 0 ? '#ffffff' : '#dc2626';
                    ctx.strokeStyle = '#ff6b81';
                    ctx.lineWidth = 2.4;
                    ctx.beginPath();
                    ctx.moveTo(0, -33);
                    ctx.lineTo(22, -2);
                    ctx.lineTo(-22, -2);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
