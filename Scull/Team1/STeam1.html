                    // Glowing X Eyes
                    ctx.strokeStyle = '#fff066';
                    ctx.lineWidth = 2.5;
                    for (const ex of [-7, 7]) {
                        const ey = -13;
                        ctx.beginPath();
                        ctx.moveTo(ex - 3.5, ey - 3.5);
                        ctx.lineTo(ex + 3.5, ey + 3.5);
                        ctx.moveTo(ex + 3.5, ey - 3.5);
                        ctx.lineTo(ex - 3.5, ey + 3.5);
                        ctx.stroke();
                    }
                } else if (en.type === 'mini_x') {
                    // Mini X spawned by X 2
                    ctx.fillStyle = en.hitFlash > 0 ? '#ffffff' : '#ef4444';
                    ctx.strokeStyle = '#fca5a5';
                    ctx.lineWidth = 1.6;
                    ctx.beginPath();
                    ctx.moveTo(0, -12);
                    ctx.lineTo(11, 9);
                    ctx.lineTo(-11, 9);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(-3, 0); ctx.lineTo(3, 5);
                    ctx.moveTo(3, 0); ctx.lineTo(-3, 5);
                    ctx.stroke();
                } else if (en.type === 'chocolate') {
                    // Looks like a chocolate bar with eyes like an alien!
                    const tilt = Math.sin(en.wobble) * 0.08;
                    ctx.save();
                    ctx.rotate(tilt);

                    // Chocolate Bar Body
                    ctx.fillStyle = en.hitFlash > 0 ? '#d9a077' : '#5c3317';
                    ctx.strokeStyle = '#8b4513';
                    ctx.lineWidth = 2;
                    ctx.fillRect(-14, -20, 28, 36);
                    ctx.strokeRect(-14, -20, 28, 36);

                    // Molded Chocolate Squares
                    ctx.strokeStyle = '#3d1e0a';
                    ctx.lineWidth = 1.4;
                    ctx.beginPath();
                    ctx.moveTo(0, -20); ctx.lineTo(0, 6);
                    ctx.moveTo(-14, -8); ctx.lineTo(14, -8);
                    ctx.stroke();

                    // Red & Silver Wrapper at bottom
                    ctx.fillStyle = '#e5e7eb';
                    ctx.fillRect(-15, 4, 30, 4);
                    ctx.fillStyle = '#dc2626';
                    ctx.fillRect(-15, 8, 30, 10);

                    // Alien Eyes peeking out of the chocolate bar!
                    ctx.fillStyle = '#a3e635';
                    ctx.beginPath();
                    ctx.ellipse(-6, -13, 4, 5, -0.2, 0, Math.PI * 2);
                    ctx.ellipse(6, -13, 4, 5, 0.2, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#090d16';
                    ctx.beginPath();
                    ctx.arc(-6, -13, 1.8, 0, Math.PI * 2);
                    ctx.arc(6, -13, 1.8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                } else if (en.type === 'Jon') {
                    // Jon: green, one eye, short
                    const hop = Math.abs(Math.sin(en.hopPhase)) * 3;
                    ctx.translate(0, -hop);

                    // Stubby short legs
                    ctx.strokeStyle = '#15803d';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(-5, 8); ctx.lineTo(-6, 15);
                    ctx.moveTo(5, 8); ctx.lineTo(6, 15);
                    ctx.stroke();

                    // Short Green Round Body/Head
                    ctx.fillStyle = en.hitFlash > 0 ? '#bbf7d0' : '#22c55e';
                    ctx.strokeStyle = '#14532d';
                    ctx.lineWidth = 1.8;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 14, 12, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    // Little Antenna
                    ctx.strokeStyle = '#22c55e';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(0, -12); ctx.lineTo(0, -18);
                    ctx.stroke();
                    ctx.fillStyle = '#fde047';
                    ctx.beginPath();
                    ctx.arc(0, -19, 2.5, 0, Math.PI * 2);
                    ctx.fill();

                    // One Big Eye
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(0, -2, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000000';
                    ctx.beginPath();
                    ctx.arc(0, -2, 2.7, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Enemy Name & HP Bar
                const barW = en.type === 'x2' ? 48 : 30;
                const topOffset = en.type === 'x2' ? -46 : -32;

                ctx.font = 'bold 10px Courier New';
                ctx.textAlign = 'center';
                ctx.fillStyle = '#ff858d';
                ctx.fillText(en.name, 0, topOffset - 5);

                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(-barW / 2, topOffset, barW, 4);
                ctx.fillStyle = '#ff2438';
                ctx.fillRect(-barW / 2, topOffset, barW * (en.hp / en.maxHp), 4);

                ctx.restore();
            }
        }

        function drawAstronautStickman(x, y, facing, walkFrame) {
            // Draw Phase Dash Afterimages
            for (const tr of player.phaseTrail) {
                ctx.save();
                ctx.globalAlpha = tr.alpha * 0.45;
                ctx.strokeStyle = '#38f2ff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(tr.x, tr.y - 20, 8, 0, Math.PI * 2);
                ctx.moveTo(tr.x, tr.y - 12);
                ctx.lineTo(tr.x, tr.y);
                ctx.stroke();
                ctx.restore();
            }

            if (player.invulnTimer > 0 && player.phaseActiveTimer <= 0 && Math.floor(player.invulnTimer / 4) % 2 === 0) {
                ctx.globalAlpha = 0.45;
            }

            const isPhasing = player.phaseActiveTimer > 0;
            ctx.strokeStyle = isPhasing ? '#38f2ff' : '#ffffff';
            ctx.fillStyle = isPhasing ? '#38f2ff' : '#ffffff';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            const headRadius = 5;
            const bodyLength = 15;
            const legLength = 11;
            const neckY = y - bodyLength;
            const headY = neckY - headRadius;
            const shoulderY = neckY + 4;

            // Astronaut Oxygen Backpack
            ctx.fillStyle = isPhasing ? 'rgba(56, 242, 255, 0.5)' : '#94a3b8';
            ctx.fillRect(x - facing * 8, neckY + 1, 5, 11);

            // Stickman Head
            ctx.beginPath();
            ctx.arc(x, headY, headRadius, 0, Math.PI * 2);
            ctx.stroke();

            // Clear Astronaut Glass Helmet Bubble!
            ctx.strokeStyle = '#7ef9ff';
            ctx.fillStyle = 'rgba(126, 249, 255, 0.16)';
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.arc(x, headY, headRadius + 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Visor Eye
            ctx.fillStyle = '#38f2ff';
            ctx.beginPath();
            ctx.arc(x + facing * 2.3, headY - 0.5, 1.4, 0, Math.PI * 2);
            ctx.fill();

            // Torso
            ctx.strokeStyle = isPhasing ? '#38f2ff' : '#ffffff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x, neckY);
            ctx.lineTo(x, y);
            ctx.stroke();

            // Legs
            const legSwing = Math.sin(walkFrame) * 6;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x - legSwing, y + legLength);
            ctx.moveTo(x, y);
            ctx.lineTo(x + legSwing, y + legLength);
            ctx.stroke();

            // Back Arm
            const armSwing = Math.sin(walkFrame + Math.PI) * 4;
            ctx.beginPath();
            ctx.moveTo(x, shoulderY);
            ctx.lineTo(x - facing * 4 - armSwing, shoulderY + 6);
            ctx.stroke();

            // Front Arm + Space Power Blaster
            const gunX = x + facing * 7;
            const gunY = shoulderY + 2;
            ctx.beginPath();
            ctx.moveTo(x, shoulderY);
            ctx.lineTo(gunX, gunY);
            ctx.stroke();

            ctx.strokeStyle = player.bigBeamCharges > 0 ? '#ffd700' : '#38f2ff';
            ctx.lineWidth = 2.6;
            ctx.beginPath();
            ctx.moveTo(gunX, gunY);
            ctx.lineTo(gunX + facing * 6, gunY);
            ctx.stroke();

            ctx.globalAlpha = 1;
        }

        function drawProjectilesBeamsAndParticles() {
            // Big Beam Magic Energy Lasers
            for (const bm of game.beams) {
                const alpha = bm.life / bm.maxLife;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.strokeStyle = '#38f2ff';
                ctx.lineWidth = 26 * alpha;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(bm.x1, bm.y1);
                ctx.lineTo(bm.x2, bm.y2);
                ctx.stroke();

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 10 * alpha;
                ctx.beginPath();
                ctx.moveTo(bm.x1, bm.y1);
                ctx.lineTo(bm.x2, bm.y2);
                ctx.stroke();
                ctx.restore();
            }

            // FOR SCIENCE Shockwaves
            for (const sw of game.scienceWaves) {
                const alpha = sw.life / sw.maxLife;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.strokeStyle = '#4dff88';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

            // Player Capture Orbs
            for (const p of game.projectiles) {
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = p.damage > 1 ? '#ffd700' : '#38f2ff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            // Enemy Projectiles (Dice Pips & X 2 Energy Orbs)
            for (const ep of game.enemyProjectiles) {
                if (ep.kind === 'dice_pip') {
                    ctx.fillStyle = '#ffffff';
                    ctx.strokeStyle = '#ff2438';
                    ctx.lineWidth = 1.6;
                    ctx.fillRect(ep.x - 6, ep.y - 6, 12, 12);
                    ctx.strokeRect(ep.x - 6, ep.y - 6, 12, 12);
                    ctx.fillStyle = '#111111';
                    ctx.font = 'bold 9px Courier New';
                    ctx.textAlign = 'center';
                    ctx.fillText(ep.pip, ep.x, ep.y + 3);
                } else {
                    ctx.fillStyle = '#ff1e56';
                    ctx.strokeStyle = '#ffd700';
                    ctx.lineWidth = 1.6;
                    ctx.beginPath();
                    ctx.arc(ep.x, ep.y, ep.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                }
            }

            // Particles
            for (const pt of game.particles) {
                ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
                ctx.fillStyle = pt.color;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Floating Popups
            ctx.font = 'bold 12px Courier New';
            ctx.textAlign = 'center';
            for (const pop of game.popups) {
                ctx.globalAlpha = Math.max(0, pop.life / pop.maxLife);
                ctx.fillStyle = pop.color;
                ctx.fillText(pop.text, pop.x, pop.y);
            }
            ctx.globalAlpha = 1;
        }

        function drawHUD() {
            const theme = getPlanetTheme(game.level);

            // Top HUD Strip
            ctx.fillStyle = 'rgba(5, 7, 15, 0.88)';
            ctx.fillRect(0, 0, canvas.width, 64);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, 64);
            ctx.lineTo(canvas.width, 64);
            ctx.stroke();

            // 1. LEFT: HP Bar + Coins
            ctx.font = 'bold 12px Courier New';
            ctx.textAlign = 'left';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(`HP: ${player.hp}/${player.maxHp}`, 14, 18);

            ctx.fillStyle = '#ffd700';
            ctx.fillText(`COINS: ${player.coins}`, 128, 18);

            const hpW = 195;
            ctx.fillStyle = '#261418';
            ctx.fillRect(14, 24, hpW, 12);
            const hpPct = player.hp / player.maxHp;
            ctx.fillStyle = hpPct > 0.5 ? '#2ecc40' : (hpPct > 0.2 ? '#ffae00' : '#ff2a55');
            ctx.fillRect(14, 24, hpW * hpPct, 12);
            ctx.strokeStyle = '#ffffff';
            ctx.strokeRect(14, 24, hpW, 12);

            // Powers Status Line (Bottom-left of HUD)
            ctx.font = 'bold 11px Courier New';
            ctx.fillStyle = player.bigBeamCharges > 0 ? '#38f2ff' : '#888888';
            ctx.fillText(`[SPACE] BEAM:${player.bigBeamCharges}`, 14, 53);

            ctx.fillStyle = player.phaseCooldown <= 0 ? '#4dff88' : '#ffae00';
            const phaseTxt = player.phaseCooldown <= 0 ? 'READY' : `${player.phaseCooldown.toFixed(1)}s`;
            ctx.fillText(`[Q] PHASE:${phaseTxt}`, 148, 53);

            ctx.fillStyle = !player.forScienceUsed ? '#ffd700' : '#666666';
            ctx.fillText(`[E] SCIENCE:${!player.forScienceUsed ? '1/1' : 'USED'}`, 270, 53);

            // 2. CENTER: Planet / Level Title + Rush Timer or Goal
            ctx.textAlign = 'center';
            ctx.font = 'bold 13px Courier New';
            ctx.fillStyle = '#ffd700';
            ctx.fillText(`${theme.name} (${game.level}/${game.maxLevels})`, canvas.width / 2, 20);

            if (theme.isRush && game.state === 'PLAYING') {
                ctx.font = 'bold 15px Courier New';
                ctx.fillStyle = game.rushTimeLeft <= 10 ? '#ff2a55' : '#ff9f1c';
                ctx.fillText(`⏱ ENEMY RUSH TIMER: ${game.rushTimeLeft.toFixed(1)}s`, canvas.width / 2, 40);
            } else if (game.ship.unlocked) {
                ctx.font = 'bold 12px Courier New';
                ctx.fillStyle = '#4dff88';
                ctx.fillText('GOAL: BOARD THE ALIEN SHIP TO GET THE ALIEN CROWN!', canvas.width / 2, 40);
            } else {
                ctx.font = '12px Courier New';
                ctx.fillStyle = '#38f2ff';
                ctx.fillText(`GOAL: CAPTURE ALL ALIENS (${game.capturedAliens} / ${game.totalAliens})`, canvas.width / 2, 40);
            }

            // 3. RIGHT: Captured Counter + Space Bugs Timer
            ctx.textAlign = 'right';
            ctx.font = 'bold 12px Courier New';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(`CAPTURED: ${game.capturedAliens}/${game.totalAliens}`, canvas.width - 14, 20);

            const bugTier = Math.floor(game.roundSeconds / 12);
            ctx.fillStyle = bugTier >= 2 ? '#ff4d6d' : (bugTier === 1 ? '#c084fc' : '#aaaaaa');
            ctx.font = 'bold 11px Courier New';
            ctx.fillText(`SPACE BUGS: ${Math.floor(game.roundSeconds)}s (TIER ${bugTier})`, canvas.width - 14, 40);

            ctx.fillStyle = '#ffd700';
            ctx.fillText('[B] SHOP (+10 COINS/KILL)', canvas.width - 14, 55);

            // Level Announcement Banner
            if (game.bannerTimer > 0 && game.state === 'PLAYING' && !game.shopOpen) {
                ctx.save();
                ctx.globalAlpha = Math.min(1, game.bannerTimer / 30);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.78)';
                ctx.fillRect(canvas.width / 2 - 290, 74, 580, 28);
                ctx.strokeStyle = '#ffd700';
                ctx.strokeRect(canvas.width / 2 - 290, 74, 580, 28);
                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 13px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(game.bannerText, canvas.width / 2, 92);
                ctx.restore();
            }
        }

        function drawShopModal() {
            if (!game.shopOpen) return;

            ctx.fillStyle = 'rgba(2, 4, 12, 0.86)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const panelW = Math.min(680, canvas.width - 40);
            const panelH = 420;
            const px = (canvas.width - panelW) / 2;
            const py = (canvas.height - panelH) / 2;

            ctx.fillStyle = '#0d1224';
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 2;
            ctx.fillRect(px, py, panelW, panelH);
            ctx.strokeRect(px, py, panelW, panelH);

            // Shop Title & Coins
            ctx.textAlign = 'left';
            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 18px Courier New';
            ctx.fillText(`POWER-UP SHOP  |  YOUR COINS: ${player.coins}`, px + 20, py + 34);

            ctx.fillStyle = '#aaaaaa';
            ctx.font = '12px Courier New';
            ctx.fillText('Click an item or press [1]-[6] to buy (+10 Coins per alien defeated)', px + 20, py + 54);

            // Close Button
            ctx.fillStyle = '#ff2a55';
            ctx.fillRect(px + panelW - 95, py + 14, 78, 28);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 12px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText('[B] CLOSE', px + panelW - 56, py + 32);

            // Shop Rows
            const startY = py + 76;
            const rowH = 52;
            for (let i = 0; i < SHOP_ITEMS.length; i++) {
                const item = SHOP_ITEMS[i];
                const ry = startY + i * rowH;
                const soldOut = item.once && item.bought;
                const canAfford = !soldOut && player.coins >= item.cost;

                ctx.fillStyle = soldOut ? 'rgba(40, 50, 70, 0.45)' : (canAfford ? 'rgba(255, 215, 0, 0.12)' : 'rgba(255, 255, 255, 0.04)');
                ctx.strokeStyle = soldOut ? '#555555' : (canAfford ? '#ffd700' : '#444c66');
                ctx.lineWidth = 1.2;
                ctx.fillRect(px + 20, ry, panelW - 40, rowH - 6);
                ctx.strokeRect(px + 20, ry, panelW - 40, rowH - 6);

                ctx.textAlign = 'left';
                ctx.font = 'bold 13px Courier New';
                ctx.fillStyle = soldOut ? '#888888' : '#ffffff';
                ctx.fillText(`[${i + 1}] ${item.name}`, px + 32, ry + 19);

                ctx.font = '11px Courier New';
                ctx.fillStyle = '#b0bdd9';
                ctx.fillText(item.desc, px + 32, ry + 36);

                ctx.textAlign = 'right';
                ctx.font = 'bold 13px Courier New';
                if (soldOut) {
                    ctx.fillStyle = '#4dff88';
                    ctx.fillText('OWNED', px + panelW - 32, ry + 27);
                } else {
                    ctx.fillStyle = canAfford ? '#ffd700' : '#ff6b6b';
                    ctx.fillText(`${item.cost} COINS`, px + panelW - 32, ry + 27);
                }
            }
        }

        function drawOverlayScreens() {
            if (game.state === 'PLAYING' || game.shopOpen) return;

            ctx.fillStyle = 'rgba(3, 5, 12, 0.84)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            ctx.textAlign = 'center';

            if (game.state === 'LEVEL_CLEAR') {
                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 28px Courier New';
                ctx.fillText('ALIEN CROWN OBTAINED!', cx, cy - 52);

                ctx.fillStyle = '#ffffff';
                ctx.font = '15px Courier New';
                ctx.fillText(`Cleared ${getPlanetTheme(game.level).name}!`, cx, cy - 16);

                ctx.fillStyle = '#4dff88';
                ctx.fillText(`+20 HP Restored  |  Coins: ${player.coins}`, cx, cy + 12);

                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 14px Courier New';
                ctx.fillText('Press [B] to Open Power-Up Shop', cx, cy + 44);

                ctx.fillStyle = '#38f2ff';
                ctx.font = 'bold 15px Courier New';
                ctx.fillText(`Press [SPACE] or [CLICK] for Level ${game.level + 1} / ${game.maxLevels}`, cx, cy + 76);
            } else if (game.state === 'VICTORY') {
                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 30px Courier New';
                ctx.fillText('VICTORY! ALL 10 PLANETS CONQUERED!', cx, cy - 48);

                ctx.fillStyle = '#ffffff';
                ctx.font = '15px Courier New';
                ctx.fillText(`You claimed the Supreme Alien Crown with ${player.coins} Coins!`, cx, cy - 10);

                ctx.fillStyle = '#4dff88';
                ctx.font = 'bold 15px Courier New';
                ctx.fillText('Press [SPACE] or [CLICK] to Play Again', cx, cy + 45);
            } else if (game.state === 'GAME_OVER') {
                ctx.fillStyle = '#ff2a55';
                ctx.font = 'bold 32px Courier New';
                ctx.fillText('MISSION FAILED', cx, cy - 44);

                ctx.fillStyle = '#ffffff';
                ctx.font = '15px Courier New';
                ctx.fillText(game.loseReason, cx, cy - 8);

                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 15px Courier New';
                ctx.fillText('Press [SPACE], [CLICK], or [R] to Restart', cx, cy + 46);
            }
        }

        function draw() {
            ctx.save();
            if (game.shakeTimer > 0) {
                const sx = (Math.random() - 0.5) * game.shakeIntensity;
                const sy = (Math.random() - 0.5) * game.shakeIntensity;
                ctx.translate(sx, sy);
            }

            drawSpaceAndPlanetBackground();
            drawAlienShipAndCrown();
            drawEnemies();
            drawAstronautStickman(player.x, player.y, player.facing, player.walkFrame);
            drawProjectilesBeamsAndParticles();

            ctx.restore();

            drawHUD();
            drawOverlayScreens();
            drawShopModal();
        }

        function animate(timestamp) {
            if (!game.lastTimestamp) game.lastTimestamp = timestamp;
            const dt = Math.min(0.05, (timestamp - game.lastTimestamp) / 1000);
            game.lastTimestamp = timestamp;

            updatePhysics(dt);
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            resizeCanvas();
            requestAnimationFrame(animate);
        };
    </script>
</body>
</html>
