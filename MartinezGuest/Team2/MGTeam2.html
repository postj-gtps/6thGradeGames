            ctx.strokeStyle = '#8d4e08';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Angry Boss Eyes
            ctx.fillStyle = '#ff1744';
            ctx.beginPath();
            ctx.arc(-13, -12, 5.5, 0, Math.PI * 2);
            ctx.arc(13, -12, 5.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(-13, -12, 2.2, 0, Math.PI * 2);
            ctx.arc(13, -12, 2.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Boss Health Bar
            ctx.fillStyle = '#1a0a00';
            ctx.fillRect(-46, -62, 92, 10);
            ctx.fillStyle = '#ff1744';
            ctx.fillRect(-44, -60, 88 * (burgerBoss.hp / burgerBoss.maxHp), 6);
            ctx.strokeStyle = '#ffd54f';
            ctx.strokeRect(-46, -62, 92, 10);

            ctx.restore();
        }

        // DIRECTIONAL ARROW TO EXIT WHEN ALL 4 TOPPINGS ARE COLLECTED
        function drawExitPointer() {
            if (currentLevel >= BOSS_LEVEL || collectedToppings < REQUIRED_TOPPINGS) return;

            const exitX = (exitTile.col + 0.5) * TILE_SIZE;
            const exitY = (exitTile.row + 0.5) * TILE_SIZE;
            const angle = Math.atan2(exitY - player.y, exitX - player.x);

            ctx.save();
            ctx.translate(player.x + Math.cos(angle) * 34, player.y - player.z + Math.sin(angle) * 34);
            ctx.rotate(angle);

            ctx.beginPath();
            ctx.moveTo(11, 0);
            ctx.lineTo(-5, -6);
            ctx.lineTo(-2, 0);
            ctx.lineTo(-5, 6);
            ctx.closePath();
            ctx.fillStyle = '#76ff03';
            ctx.fill();
            ctx.restore();
        }

        // VISUAL BURGER BUILDER STACK ON LEFT HUD
        function drawBurgerBuilderStack() {
            const boxX = 14;
            const boxY = 14;
            const boxW = 132;
            const boxH = 196;

            ctx.save();
            ctx.fillStyle = 'rgba(20, 12, 2, 0.85)';
            ctx.fillRect(boxX, boxY, boxW, boxH);
            ctx.strokeStyle = '#f4b400';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(boxX, boxY, boxW, boxH);

            ctx.fillStyle = '#ffd54f';
            ctx.font = 'bold 11px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText('BURGER STACK', boxX + boxW / 2, boxY + 16);
            ctx.fillText(`${builtLayers.length} / 8 LAYERS`, boxX + boxW / 2, boxY + 30);

            const baseY = boxY + boxH - 18;
            for (let i = 0; i < builtLayers.length; i++) {
                const layer = builtLayers[i];
                const ly = baseY - i * 16;
                ctx.fillStyle = layer.color;
                ctx.beginPath();
                ctx.ellipse(boxX + boxW / 2, ly, 42, 8, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = layer.trim;
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }

            if (builtLayers.length === 0) {
                ctx.fillStyle = '#a1887f';
                ctx.font = '10px Courier New';
                ctx.fillText('Collect 4 buns', boxX + boxW / 2, boxY + 100);
                ctx.fillText('to start burger!', boxX + boxW / 2, boxY + 114);
            }

            ctx.restore();
        }

        // CORNER MINIMAP
        function drawMinimap() {
            const scale = 6;
            const mapW = mazeCols * scale;
            const mapH = mazeRows * scale;
            const pad = 14;
            const ox = canvas.width - mapW - pad;
            const oy = pad;

            ctx.save();
            ctx.fillStyle = 'rgba(20, 12, 2, 0.85)';
            ctx.fillRect(ox - 4, oy - 4, mapW + 8, mapH + 8);
            ctx.strokeStyle = '#f4b400';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(ox - 4, oy - 4, mapW + 8, mapH + 8);

            for (let r = 0; r < mazeRows; r++) {
                for (let c = 0; c < mazeCols; c++) {
                    if (mazeGrid[r][c] === 1) {
                        ctx.fillStyle = '#b27800';
                        ctx.fillRect(ox + c * scale, oy + r * scale, scale, scale);
                    }
                }
            }

            if (currentLevel < BOSS_LEVEL) {
                ctx.fillStyle = collectedToppings >= REQUIRED_TOPPINGS ? '#76ff03' : '#ff5252';
                ctx.fillRect(ox + exitTile.col * scale, oy + exitTile.row * scale, scale, scale);

                ctx.fillStyle = '#ffea00';
                for (const item of toppings) {
                    if (!item.collected) {
                        const zc = Math.floor(item.x / TILE_SIZE);
                        const zr = Math.floor(item.y / TILE_SIZE);
                        ctx.fillRect(ox + zc * scale + 1, oy + zr * scale + 1, scale - 2, scale - 2);
                    }
                }

                // Big Rat dot
                ctx.fillStyle = '#9e9e9e';
                ctx.beginPath();
                ctx.arc(ox + (bigRat.x / TILE_SIZE) * scale, oy + (bigRat.y / TILE_SIZE) * scale, 3, 0, Math.PI * 2);
                ctx.fill();
            } else if (burgerBoss.active) {
                ctx.fillStyle = '#ff9800';
                ctx.beginPath();
                ctx.arc(ox + (burgerBoss.x / TILE_SIZE) * scale, oy + (burgerBoss.y / TILE_SIZE) * scale, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            // Player dot
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(ox + (player.x / TILE_SIZE) * scale, oy + (player.y / TILE_SIZE) * scale, 3.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function draw() {
            ctx.fillStyle = '#160e02';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-camera.x, -camera.y);

            // 1. Floor + flat ground hazards (melted cheese, bear traps, boost pads, exit)
            drawFloorAndGroundDecals();

            // 2. Collect 2.5D Depth-Sorted Renderables (walls, low cheese walls, toppings, rat, player, boss)
            const renderables = [];

            const startCol = Math.max(0, Math.floor(camera.x / TILE_SIZE));
            const endCol = Math.min(mazeCols - 1, Math.ceil((camera.x + canvas.width) / TILE_SIZE));
            const startRow = Math.max(0, Math.floor(camera.y / TILE_SIZE));
            const endRow = Math.min(mazeRows - 1, Math.ceil((camera.y + canvas.height + WALL_EXTRUDE_H) / TILE_SIZE));

            for (let r = startRow; r <= endRow; r++) {
                for (let c = startCol; c <= endCol; c++) {
                    if (mazeGrid[r][c] === 1) {
                        renderables.push({
                            sortY: (r + 1) * TILE_SIZE,
                            draw: () => draw25DWallTile(c, r)
                        });
                    }
                }
            }

            for (const lw of lowCheeseWalls) {
                renderables.push({
                    sortY: lw.y + lw.h / 2,
                    draw: () => drawLowCheeseWall(lw)
                });
            }

            for (const item of toppings) {
                if (!item.collected) {
                    renderables.push({
                        sortY: item.y,
                        draw: () => drawBurgerTopping(item)
                    });
                }
            }

            if (currentLevel < BOSS_LEVEL) {
                renderables.push({
                    sortY: bigRat.y,
                    draw: drawBigRat
                });
            }

            if (burgerBoss.active) {
                renderables.push({
                    sortY: burgerBoss.y,
                    draw: drawLivingBurgerBoss
                });
            }

            renderables.push({
                sortY: player.y,
                draw: drawCheeseStickman
            });

            // Painter's algorithm sort by Y ground coordinate for authentic 2.5D depth!
            renderables.sort((a, b) => a.sortY - b.sortY);
            for (const obj of renderables) {
                obj.draw();
            }

            // 3. Melted Cheese Gun Projectiles
            for (const p of cheeseProjectiles) {
                ctx.fillStyle = '#ffea00';
                ctx.beginPath();
                ctx.arc(p.x, p.y - p.z, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ff6f00';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // 4. Particles & Floating Popups
            for (const pt of particles) {
                ctx.fillStyle = pt.color;
                ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
            }

            drawExitPointer();

            for (const ft of floatingTexts) {
                ctx.fillStyle = ft.color || '#fff59d';
                ctx.font = 'bold 13px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
            }

            ctx.restore();

            // Screen-space HUD Overlays
            drawBurgerBuilderStack();
            drawMinimap();

            if (levelBannerTimer > 0 && !gameOver && !gameWon) {
                ctx.save();
                ctx.fillStyle = 'rgba(22, 14, 2, 0.88)';
                ctx.fillRect(canvas.width / 2 - 260, 20, 520, 50);
                ctx.strokeStyle = '#ffd54f';
                ctx.lineWidth = 2;
                ctx.strokeRect(canvas.width / 2 - 260, 20, 520, 50);

                ctx.fillStyle = '#ffd54f';
                ctx.font = 'bold 15px Courier New';
                ctx.textAlign = 'center';
                if (currentLevel === BOSS_LEVEL) {
                    ctx.fillText('FINAL BOSS: THE BURGER CAME ALIVE!', canvas.width / 2, 41);
                    ctx.font = 'bold 12px Courier New';
                    ctx.fillStyle = '#ffeb3b';
                    ctx.fillText('Press [E] or [CLICK] to fire your MELTED CHEESE GUN!', canvas.width / 2, 59);
                } else {
                    const info = BURGER_LEVELS[currentLevel - 1];
                    ctx.fillText(`LEVEL ${currentLevel}/8 — ${info.name}`, canvas.width / 2, 41);
                    ctx.font = 'bold 12px Courier New';
                    ctx.fillStyle = '#fff3c4';
                    ctx.fillText(`Collect 4 ${info.plural} & escape the Big Rat!`, canvas.width / 2, 59);
                }
                ctx.restore();
            }

            if (gameOver) {
                ctx.save();
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ff5252';
                ctx.font = 'bold 32px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER!', canvas.width / 2, canvas.height / 2 - 32);

                ctx.fillStyle = '#ffd54f';
                ctx.font = 'bold 19px Courier New';
                ctx.fillText(loseReason, canvas.width / 2, canvas.height / 2 + 6);

                ctx.fillStyle = '#ffffff';
                ctx.font = '14px Courier New';
                ctx.fillText(`Reached Level ${currentLevel} | Press [SPACE] or click Reset to try again`, canvas.width / 2, canvas.height / 2 + 44);
                ctx.restore();
            }

            if (gameWon) {
                ctx.save();
                ctx.fillStyle = 'rgba(18, 12, 2, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#76ff03';
                ctx.font = 'bold 34px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('YOU DEFEATED THE LIVING BURGER!', canvas.width / 2, canvas.height / 2 - 36);

                ctx.fillStyle = '#ffd54f';
                ctx.font = 'bold 18px Courier New';
                ctx.fillText('You built all 8 burger layers and conquered The Cheese Maze!', canvas.width / 2, canvas.height / 2 + 4);

                ctx.fillStyle = '#ffffff';
                ctx.font = '14px Courier New';
                ctx.fillText('Press [SPACE] or click Reset to play again', canvas.width / 2, canvas.height / 2 + 44);
                ctx.restore();
            }
        }

        function animate(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const dt = Math.min(0.05, (timestamp - lastTimestamp) / 1000);
            lastTimestamp = timestamp;

            updatePhysics(dt);
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function () {
            resizeCanvas();
            requestAnimationFrame(animate);
        };
    </script>
</body>
</html>
